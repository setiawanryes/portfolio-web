<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roni Setiawan - Portfolio Honeycomb Presisi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        
        /* ========================================================= */
        /* 0. DASAR DAN FONT */
        /* ========================================================= */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        /* Gaya Tambahan untuk Teks Hero dan Tombol */
        .hero h1 { font-size: 3em; margin-bottom: 0.1em; }
        .hero h1 span { color: #ff5722; }
        .hero h3 { color: #ccc; font-weight: 300; }
        .socials a { color: #fff; margin-right: 15px; font-size: 1.5em; opacity: 0.7; transition: opacity 0.3s; }
        .socials a:hover { opacity: 1; }
        .btn1 { 
            background-color: #ff5722; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 5px; 
            margin-right: 10px; display: inline-block; transition: background-color 0.3s;
        }
        .btn1:hover { background-color: #e64a19; }
        .mini-popup { display: none; position: absolute; background: #333; padding: 10px; border-radius: 5px; z-index: 10; }
        .mini-popup.active { display: block; }
        .mini-popup a { color: #fff; display: block; padding: 5px 0; text-decoration: none; }


        /* ========================================================= */
        /* 1. LAYOUT HERO (Dua Kolom - Flexbox) */
        /* ========================================================= */
        .hero {
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            padding: 100px 5%; 
            min-height: 80vh; 
            width: 100%;
        }

        .hero-text {
            width: 45%; 
            max-width: 550px; 
        }

        .kolase-wrapper {
            width: 50%;
            position: relative; 
            margin: 0; 
        }

        /* ========================================================= */
        /* 2. GAYA KOLASE HEKSAGON SARANG MADU (HONEYCOMB - CSS Presisi) */
        /* ========================================================= */
        .kolase-img.kolase-hexagons {
            display: inline-block; 
            margin: 20px auto; 
            font-size: 0; 
            min-height: auto; 
            width: auto; 
            position: relative; 
        }

        /* Container untuk setiap baris virtual heksagon */
        .kolase-row {
            clear: both; 
            margin-bottom: -28.5px; /* Overlap vertikal untuk HEX_HEIGHT 150px */
        }

        .kolase-row:nth-child(even) { 
            margin-left: 75px; /* Geser baris genap setengah HEX_WIDTH */
        }

        /* Item Heksagon */
        .kolase-item {
            float: left; 
            width: 150px; 
            height: 150px; 
            margin: 0 4px; /* Jarak horizontal antar heksagon */
            position: relative; 
            /* Bentuk Heksagon */
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            -webkit-clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            background-color: transparent; 
            transform: rotate(0deg); /* Kunci rotasi 0 */
        }
        
        /* EFEK HOVER (Interaktif) */
        .kolase-item:hover {
            transform: scale(1.08) rotate(0deg) !important; 
            z-index: 10; 
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); 
            cursor: pointer;
        }

        .kolase-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8; 
            transition: opacity 0.4s ease-in-out; 
        }

        /* Efek Outline */
        .kolase-item.outline {
            background-color: transparent !important; 
            border: 3px solid; 
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2); 
            overflow: hidden; 
        }

        .kolase-item.outline img {
            visibility: hidden; 
            opacity: 0;
        }


        /* ========================================================= */
        /* 3. MEDIA QUERIES (Responsif) */
        /* ========================================================= */
        @media (max-width: 900px) {
            .hero {
                flex-direction: column; 
                padding: 50px 5%;
            }

            .hero-text, .kolase-wrapper {
                width: 100%;
                max-width: none;
                margin-bottom: 30px; 
            }
            
            .kolase-img.kolase-hexagons {
                min-height: auto; 
            }
            
            /* Penyesuaian Mobile */
            .kolase-item {
                width: 100px;
                height: 100px;
                margin-bottom: -19px; /* Overlap disesuaikan untuk 100px height */
            }
            .kolase-row:nth-child(even) { 
                margin-left: 50px; /* Geser baris genap setengah HEX_WIDTH baru */
            }
        }
    </style>
</head>
<body>

    <section id="home" class="hero">
        
        <div class="hero-text">
            <h3>Hello, I am</h3>
            <h1>Roni <span>Setiawan</span></h1>
            <div class="role-slider">
                <div class="slide-text" id="role-text">Web Developer</div>
            </div>
            <p>
                I’m Roni Setiawan, an administration and data professional with a passion for web development. I love blending
                design, data, and storytelling to create websites that inspire and make a difference.
            </p>

            <div class="socials">
                <a href="https://www.facebook.com/rstwnnn"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.tiktok.com/@setiawanryes_"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.instagram.com/setiawanryes_"><i class="fab fa-instagram"></i></a>
                <a href="https://www.linkedin.com/in/rstwn"><i class="fab fa-linkedin-in"></i></a>
                <a href="mailto:ronisetiawan496@gmail.com"><i class="fa-solid fa-envelope"></i></a>
            </div>

            <div class="buttons">
                <a href="mailto:ronisetiawan496@gmail.com" class="btn1">Hire Me</a>

                <div class="button-wrapper">
                    <a href="javascript:void(0)" class="btn" onclick="togglePopup('popupDl')">Download CV</a>
                    <div id="popupDl" class="mini-popup">
                        <div class="popup-arrow"></div>
                        <div class="dl-links">
                            <a href="#" target="_blank">English</a>
                            <a href="#" target="_blank">Indonesia</a>
                        </div>
                    </div>
                </div>
            </div>
        </div> 

        <div class="kolase-wrapper">
            <div class="kolase-img kolase-hexagons">
                
                <div class="kolase-row">
                    <div class="kolase-item"><img src="images/home/1.jpeg" alt="Preview 1" class="lightbox-img"></div>
                    <div class="kolase-item"><img src="images/home/2.jpeg" alt="Preview 2" class="lightbox-img"></div>
                    <div class="kolase-item"><img src="images/home/3.jpeg" alt="Preview 3" class="lightbox-img"></div>
                </div>
                
                <div class="kolase-row">
                    <div class="kolase-item"><img src="images/home/4.jpeg" alt="Preview 4" class="lightbox-img"></div>
                    <div class="kolase-item"><img src="images/home/5.jpeg" alt="Preview 5" class="lightbox-img"></div>
                    <div class="kolase-item"><img src="images/home/6.jpeg" alt="Preview 6" class="lightbox-img"></div>
                </div>
                
                <div class="kolase-row">
                    <div class="kolase-item"><img src="images/home/1.jpeg" alt="Preview 7" class="lightbox-img"></div>
                    <div class="kolase-item"><img src="images/home/2.jpeg" alt="Preview 8" class="lightbox-img"></div>
                    <div class="kolase-item"><img src="images/home/3.jpeg" alt="Preview 9" class="lightbox-img"></div>
                </div>
                
                </div>
        </div>

    </section>

<script>
    // FUNGSI POPUP (Dipertahankan)
    function togglePopup(popupId) {
        const popup = document.getElementById(popupId);
        const allPopups = document.querySelectorAll('.mini-popup');
        const isAlreadyOpen = popup && popup.classList.contains('active');

        allPopups.forEach(p => p.classList.remove('active'));

        if (popup && !isAlreadyOpen) {
            popup.classList.add('active');
        }
    }
    window.onclick = function (event) {
        if (!event.target.matches('.btn') && !event.target.closest('.button-wrapper')) { 
            const allPopups = document.querySelectorAll('.mini-popup');
            allPopups.forEach(p => p.classList.remove('active'));
        }
    }
    
    
    document.addEventListener("DOMContentLoaded", () => {

        // --- Daftar semua path gambar yang bisa di-shuffle ---
        const ALL_IMAGE_PATHS = [
            "images/home/1.jpeg", "images/home/2.jpeg", "images/home/3.jpeg",
            "images/home/4.jpeg", "images/home/5.jpeg", "images/home/2.jpeg",
            "images/home/7.jpeg", "images/home/3.jpeg", "images/home/1.jpeg",
        ];

        // 🔄 FUNGSI UTAMA SHUFFLE GAMBAR
        function shuffleImagesInKolase(kolaseItems, imagePaths) {
            kolaseItems.forEach(item => {
                if (!item.classList.contains('outline')) {
                    const imgElement = item.querySelector('img');
                    if (imgElement) {
                        imgElement.style.opacity = 0; 
                        
                        setTimeout(() => {
                            const randomIndex = Math.floor(Math.random() * imagePaths.length);
                            imgElement.src = imagePaths[randomIndex];
                            imgElement.style.opacity = 0.8; 
                        }, 400); 
                    }
                }
            });
        }


        // --- 🛠️ FUNGSI UNTUK MENGSETUP KOLASE (Hanya Warna/Outline/Fade-in) ---
        function setupKolase(containerSelector, solidColors, outlineColor) {
            const kolaseContainer = document.querySelector(containerSelector);
            if (!kolaseContainer) return;

            const kolaseItems = kolaseContainer.querySelectorAll(".kolase-item");
            if (kolaseItems.length === 0) return;

            kolaseItems.forEach((item, index) => {
                
                // Rotasi dan Posisi DIURUS SEPENUHNYA OLEH CSS.

                // Warna dan Outline Acak
                const isOutline = Math.random() > 0.4; // 60% Solid, 40% Outline
                
                if (isOutline) {
                    item.classList.add('outline');
                    item.style.borderColor = outlineColor;
                    item.style.backgroundColor = 'transparent'; 
                } else {
                    item.classList.remove('outline');
                    const randomColor = solidColors[Math.floor(Math.random() * solidColors.length)];
                    item.style.backgroundColor = randomColor;
                }

                // Tampilkan item (Fade-in)
                setTimeout(() => {
                    item.style.opacity = 1;
                }, index * 50); 
            });
            
            // --- 3. MULAI SHUFFLE GAMBAR ---
            setInterval(() => {
                shuffleImagesInKolase(kolaseItems, ALL_IMAGE_PATHS);
            }, 4000); 
        }

        // --- PANGGILAN FUNGSI KOLASE ---
        const HEX_PALETTE_RGBA = [
            'rgba(123, 63, 0, 0.7)', 'rgba(165, 42, 42, 0.7)',  
            'rgba(210, 180, 140, 0.7)', 'rgba(188, 143, 143, 0.7)',
            'rgba(224, 184, 145, 0.7)' 
        ];

        setupKolase(
            '.kolase-hexagons',
            HEX_PALETTE_RGBA,
            '#7B3F00' 
        );

    }); 
</script>

</body>
</html>
