    <style>
        /* ========================================================= */
        /* 0. DASAR DAN FONT */
        /* ========================================================= */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        /* Gaya Tambahan untuk Teks Hero dan Tombol */
        .hero h1 { font-size: 3em; margin-bottom: 0.1em; }
        .hero h1 span { color: #ff5722; }
        .hero h3 { color: #ccc; font-weight: 300; }
        .role-slider { height: 1.5em; overflow: hidden; }
        .socials a { color: #fff; margin-right: 15px; font-size: 1.5em; opacity: 0.7; transition: opacity 0.3s; }
        .socials a:hover { opacity: 1; }
        .btn1 { 
            background-color: #ff5722; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 5px; 
            margin-right: 10px; display: inline-block; transition: background-color 0.3s;
        }
        .btn1:hover { background-color: #e64a19; }
        .mini-popup { display: none; position: absolute; background: #333; padding: 10px; border-radius: 5px; z-index: 10; }
        .mini-popup.active { display: block; }
        .mini-popup a { color: #fff; display: block; padding: 5px 0; text-decoration: none; }


        /* ========================================================= */
        /* 1. LAYOUT HERO (Dua Kolom - Flexbox) */
        /* ========================================================= */
        .hero {
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            padding: 100px 5%; 
            min-height: 80vh; 
            width: 100%;
        }

        .hero-text {
            width: 45%; 
            max-width: 550px; 
        }

        .kolase-wrapper {
            width: 50%;
            position: relative; 
            margin: 0; 
        }

        /* ========================================================= */
        /* 2. GAYA KOLASE HEKSAGON SARANG MADU (HONEYCOMB) */
        /* ========================================================= */
        .kolase-img.kolase-hexagons {
            min-height: 650px; 
            width: 100%;
            position: relative;
            background-color: transparent; 
            overflow: hidden; 
            padding-left: 10px; 
        }

        /* Item Kolase */
        .kolase-item {
            position: absolute;
            opacity: 0; 
            /* Rotasi dikunci 0 deg di sini */
            transform: rotate(0deg); 
            /* Transisi untuk fade-in, dan efek hover */
            transition: opacity 0.5s ease-in-out, transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out; 
            box-sizing: border-box; 
            
            width: 150px; 
            height: 150px; 
        }
        
        /* EFEK HOVER (Interaktif) */
        .kolase-item:hover {
            /* Membesar sedikit, Rotasi DILARANG berubah */
            transform: scale(1.08) rotate(0deg) !important; 
            z-index: 10; 
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); 
            cursor: pointer;
        }

        .kolase-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.8; 
            transition: opacity 0.4s ease-in-out; 
        }

        /* Efek Outline (Dibuat tegas) */
        .kolase-item.outline {
            background-color: transparent !important; 
            border: 3px solid; 
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2); 
        }

        .kolase-item.outline img {
            visibility: hidden; 
        }


        /* ========================================================= */
        /* 3. MEDIA QUERIES (Responsif) */
        /* ========================================================= */
        @media (max-width: 900px) {
            .hero {
                flex-direction: column; 
                padding: 50px 5%;
            }

            .hero-text, .kolase-wrapper {
                width: 100%;
                max-width: none;
                margin-bottom: 30px; 
            }
            
            .kolase-img.kolase-hexagons {
                min-height: 400px;
            }
            
            /* Kecilkan ukuran heksagon di mobile */
            .kolase-item {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

<script>
    // FUNGSI POPUP (Dipertahankan)
    function togglePopup(popupId) {
        const popup = document.getElementById(popupId);
        const allPopups = document.querySelectorAll('.mini-popup');
        const isAlreadyOpen = popup && popup.classList.contains('active');

        allPopups.forEach(p => p.classList.remove('active'));

        if (popup && !isAlreadyOpen) {
            popup.classList.add('active');
        }
    }
    window.onclick = function (event) {
        if (!event.target.matches('.btn') && !event.target.closest('.button-wrapper')) { 
            const allPopups = document.querySelectorAll('.mini-popup');
            allPopups.forEach(p => p.classList.remove('active'));
        }
    }
    
    
    document.addEventListener("DOMContentLoaded", () => {

        // --- Daftar semua path gambar yang bisa di-shuffle ---
        const ALL_IMAGE_PATHS = [
            "images/home/1.jpeg", "images/home/2.jpeg", "images/home/3.jpeg",
            "images/home/4.jpeg", "images/home/5.jpeg", "images/home/6.jpeg",
            "images/home/7.jpeg", "images/home/8.jpeg", "images/home/9.jpeg",
        ];

        // 🔄 FUNGSI UTAMA SHUFFLE GAMBAR
        function shuffleImagesInKolase(kolaseItems, imagePaths) {
            kolaseItems.forEach(item => {
                if (!item.classList.contains('outline')) {
                    const imgElement = item.querySelector('img');
                    if (imgElement) {
                        imgElement.style.opacity = 0; 
                        
                        setTimeout(() => {
                            const randomIndex = Math.floor(Math.random() * imagePaths.length);
                            imgElement.src = imagePaths[randomIndex];
                            imgElement.style.opacity = 0.8; 
                        }, 400); 
                    }
                }
            });
        }


        // --- 🛠️ FUNGSI UNTUK MENGSETUP KOLASE STATIS & BERPOLA SARANG MADU ---
        function setupKolase(containerSelector, solidColors, outlineColor) {
            const kolaseContainer = document.querySelector(containerSelector);
            if (!kolaseContainer) return;

            const kolaseItems = kolaseContainer.querySelectorAll(".kolase-item");
            if (kolaseItems.length === 0) return;

            const HEXAGON_SHAPE = "polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%)";
            
            // --- NILAI UNTUK POLA SARANG MADU (Presisi) ---
            const HEX_WIDTH = 150; 
            const HEX_HEIGHT = 150; 
            
            const H_SPACING = HEX_WIDTH * 0.75; 
            const V_SPACING = HEX_HEIGHT * 0.866; 
            const COLS_PER_ROW = 5; 

            kolaseItems.forEach((item, index) => {
                
                const row = Math.floor(index / COLS_PER_ROW);
                const col = index % COLS_PER_ROW; 

                let top = row * V_SPACING;
                let left = col * H_SPACING;

                // Geser baris ganjil untuk pola sarang madu
                if (row % 2 === 1) {
                    left += HEX_WIDTH / 2;
                }

                // Tambahkan sedikit keacakan posisi (Opsional: agar tidak terlalu kaku)
                const randomShift = Math.random() * 8 - 4; // Geser antara -4px hingga +4px
                top += randomShift;
                left += randomShift;
                
                // Kunci rotasi ke 0 derajat (TIDAK JUNGKIR BALIK)
                const rotation = 0; 

                // Terapkan Gaya dan Posisi
                item.style.width = `${HEX_WIDTH}px`;
                item.style.height = `${HEX_HEIGHT}px`;
                item.style.top = top + 'px';
                item.style.left = left + 'px';
                item.style.transform = `rotate(${rotation}deg)`; 
                
                item.style.clipPath = HEXAGON_SHAPE;
                item.style.webkitClipPath = HEXAGON_SHAPE;
                item.style.animation = 'none'; 

                // Warna dan Outline Acak
                const isOutline = Math.random() > 0.4; 
                
                if (isOutline) {
                    item.classList.add('outline');
                    item.style.borderColor = outlineColor;
                    item.style.backgroundColor = 'transparent'; 
                } else {
                    item.classList.remove('outline');
                    const randomColor = solidColors[Math.floor(Math.random() * solidColors.length)];
                    item.style.backgroundColor = randomColor;
                }

                // Tampilkan item (Fade-in)
                setTimeout(() => {
                    item.style.opacity = 1;
                }, index * 50); 
            });
            
            // --- 3. MULAI SHUFFLE GAMBAR ---
            setInterval(() => {
                shuffleImagesInKolase(kolaseItems, ALL_IMAGE_PATHS);
            }, 4000); 
        }

        // --- PANGGILAN FUNGSI KOLASE ---
        const HEX_PALETTE_RGBA = [
            'rgba(123, 63, 0, 0.7)', 'rgba(165, 42, 42, 0.7)',  
            'rgba(210, 180, 140, 0.7)', 'rgba(188, 143, 143, 0.7)',
            'rgba(224, 184, 145, 0.7)' 
        ];

        setupKolase(
            '.kolase-hexagons',
            HEX_PALETTE_RGBA,
            '#7B3F00' 
        );

    }); 
</script>
