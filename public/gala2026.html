<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RONI'S GALA 2026 - LIVE PARTY</title>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // =========================================================================
        // 👇👇 PASTE KODE CONFIG FIREBASE KAMU DI SINI (TIMPA KODE INI) 👇👇
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBGS2_U6M-lC0YozJd0FCHpncyNLE1mE2g",
            authDomain: "portfolio-setiawanryes.firebaseapp.com",
            projectId: "portfolio-setiawanryes",
            storageBucket: "portfolio-setiawanryes.firebasestorage.app",
            messagingSenderId: "171755400027",
            appId: "1:171755400027:web:6bbbbbda56613af0b4087e",
            measurementId: "G-4R3C18RXW0"
        };
  // =========================================================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Expose ke global
        window.db = db; window.push = push; window.ref = ref;
        window.onChildAdded = onChildAdded; window.runTransaction = runTransaction;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            color: white; height: 100vh; overflow: hidden; font-family: 'Poppins', sans-serif;
            display: flex; flex-direction: column;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

        /* --- HEADER AREA --- */
        .header-container {
            z-index: 10; padding: 15px 15px 5px 15px; text-align: center; flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .title {
            font-family: 'Cinzel', serif; color: #ffd700; font-size: 0.9rem; letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255,215,0,0.8); animation: neon 2s infinite alternate;
        }
        .year {
            font-size: 2.5rem; font-weight: 900; line-height: 1; margin: 5px 0 15px 0;
            background: linear-gradient(45deg, #fff, #ffd700, #b8860b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.6));
            animation: float 3s ease-in-out infinite;
        }

        /* --- NEW SLIDER CARD STYLE --- */
        .slider-wrapper {
            width: 100%; max-width: 500px; height: 70px; margin: 0 auto;
            position: relative; overflow: hidden;
        }
        
        .roast-card {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 215, 0, 0.1); 
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 5px 15px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
            
            /* Animasi Masuk */
            animation: slideUpFade 4s infinite;
        }

        .roast-title {
            color: #ffd700; font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: bold;
            margin-bottom: 2px; letter-spacing: 1px;
        }
        .roast-content {
            color: #fff; font-size: 0.85rem; font-style: italic; line-height: 1.2;
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px) scale(0.9); }
            10% { opacity: 1; transform: translateY(0) scale(1); }
            90% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-20px) scale(0.9); }
        }

        /* --- FEED CHAT --- */
        .feed-container {
            flex: 1; overflow-y: auto; padding: 10px 15px; z-index: 10;
            display: flex; flex-direction: column; gap: 12px;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            scrollbar-width: none;
        }
        .feed-container::-webkit-scrollbar { display: none; }

        .wish-card {
            background: rgba(30, 30, 50, 0.4); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.1); border-radius: 15px;
            padding: 12px; animation: popIn 0.4s ease-out;
            max-width: 600px; margin: 0 auto; width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.2s;
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .sender-name { color: #ffd700; font-weight: 700; font-size: 0.9rem; font-family: 'Cinzel'; }
        .timestamp { font-size: 0.65rem; opacity: 0.6; }
        .card-body { font-size: 0.95rem; color: #fff; line-height: 1.4; text-shadow: 0 1px 2px black; }
        
        .card-actions { display: flex; gap: 15px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; color: #ccc; }
        .action-btn { cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .liked { color: #ff4444; font-weight: bold; }

        /* Reply Area */
        .reply-container { margin-top: 5px; padding-left: 10px; border-left: 2px solid #ffd700; display: none; }
        .reply-item { font-size: 0.8rem; color: #ddd; margin-top: 3px; }
        .reply-input-box { display: none; margin-top: 8px; gap: 5px; }
        .reply-input-box.show { display: flex; }
        .reply-in { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid #555; color: white; padding: 5px; border-radius: 5px; }
        .reply-btn { background: #ffd700; border: none; padding: 0 10px; font-weight: bold; cursor: pointer; border-radius: 5px; }

        /* --- INPUT BAWAH --- */
        .input-wrapper {
            background: rgba(10, 10, 20, 0.95); backdrop-filter: blur(15px);
            padding: 15px; border-top: 1px solid rgba(255,215,0,0.2);
            z-index: 20; display: flex; justify-content: center;
        }
        .input-group { display: flex; gap: 8px; width: 100%; max-width: 600px; }
        #name-input { width: 30%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,215,0,0.3); color: #ffd700; font-weight: bold; border-radius: 10px; padding: 10px; text-align: center; }
        #msg-input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,215,0,0.3); color: white; border-radius: 10px; padding: 10px; }
        #send-btn { background: linear-gradient(45deg, #ffd700, #b8860b); border: none; border-radius: 10px; width: 50px; cursor: pointer; font-size: 1.2rem; box-shadow: 0 0 15px rgba(255,215,0,0.3); }

        /* Overlay */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; transition: 0.8s;
        }
        .btn-start {
            padding: 15px 30px; border: 2px solid #ffd700; color: #ffd700; font-family: 'Cinzel';
            font-size: 1.2rem; border-radius: 50px; animation: pulse 1.5s infinite;
        }

        /* Animations */
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); } }
        @keyframes neon { from { text-shadow: 0 0 10px rgba(255,215,0,0.8); } to { text-shadow: 0 0 20px rgba(255,215,0,1), 0 0 30px rgba(255,215,0,0.5); } }
        .shake { animation: shakeAnim 0.3s; }
        @keyframes shakeAnim { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(5px, 5px); } 75% { transform: translate(-5px, -5px); } }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="btn-start">MASUK PARTY 2026</div>
        <p style="color:#888; margin-top:15px; font-size:0.8rem;">Tap untuk musik & kembang api</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="header-container" id="main-header">
        <div class="title">LIVE HOPE & WISHES</div>
        <div class="year">2026</div>
        
        <div class="slider-wrapper" id="slider-container">
            </div>
    </div>

    <div class="feed-container" id="feed">
        <div style="text-align:center; color:#888; margin-top:50px;">Belum ada yang kirim doa...<br>Jadilah yang pertama!</div>
    </div>

    <div class="input-wrapper">
        <div class="input-group">
            <input type="text" id="name-input" placeholder="Nama" maxlength="10">
            <input type="text" id="msg-input" placeholder="Harapan 2026...">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script>
        // --- LOGIC SLIDER CARD (NEW!) ---
        const roastData = [
            { title: "GEN 98", text: "Kapan nikah? Udah 2026 woy! Jangan jadi beban keluarga mulu 🤣" },
            { title: "RESOLUSI", text: "Semoga saldo ATM sepanjang antrian BPJS. Aminin!" },
            { title: "KEUANGAN", text: "Jangan cuma wacana Healing, lunasin dulu tuh Billing!" },
            { title: "RELATE", text: "Pinjam dulu seratus? Maaf, tahun baru utang lama lunasin dulu." },
            { title: "TIM JOMBLO", text: "Berhenti jagain jodoh orang. Saatnya jadi pemeran utama!" },
            { title: "BODY GOALS", text: "Diet wacana sudah berlalu, 2026 perut rata nomor satu." }
        ];

        let sliderIndex = 0;
        const sliderContainer = document.getElementById('slider-container');

        function showNextCard() {
            const item = roastData[sliderIndex];
            
            // Hapus konten lama & trigger reflow CSS biar animasi restart
            sliderContainer.innerHTML = '';
            
            const card = document.createElement('div');
            card.className = 'roast-card';
            card.innerHTML = `
                <div class="roast-title">✨ ${item.title} ✨</div>
                <div class="roast-content">"${item.text}"</div>
            `;
            
            sliderContainer.appendChild(card);
            sliderIndex = (sliderIndex + 1) % roastData.length;
        }

        // Jalanin pertama kali
        showNextCard();
        // Ganti setiap 4 detik (sesuai durasi animasi CSS)
        setInterval(showNextCard, 4000);


        // --- VISUAL MERIAH (PARTICLE & SOUND) ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const header = document.getElementById('main-header');
        let audioCtx;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            if(type === 'boom') {
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            } else { 
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }
            
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (type==='boom'?0.5:0.1));
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const a = Math.random() * 6.28; const s = Math.random() * 6 + 2;
                this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
                this.life = 1; this.decay = Math.random() * 0.015 + 0.01;
                this.gravity = 0.05;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += this.gravity; this.life -= this.decay; }
            draw() { 
                ctx.globalAlpha = this.life; ctx.fillStyle = this.color; 
                ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, 6.28); ctx.fill(); 
            }
        }

        let particles = [];
        let stars = [];
        for(let i=0; i<150; i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2});

        function createExplosion(x, y, color) {
            playSound('boom');
            const c = color || `hsl(${Math.random()*360}, 100%, 60%)`;
            for(let i=0; i<40; i++) particles.push(new Particle(x, y, c));
        }

        function animate() {
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0,0,canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255,255,255,${Math.random()})`;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.28); ctx.fill();
            });
            particles.forEach((p,i) => { p.update(); p.draw(); if(p.life<=0) particles.splice(i,1); });
            if(Math.random() < 0.02) createExplosion(Math.random()*canvas.width, Math.random()*canvas.height*0.6);
            requestAnimationFrame(animate);
        }

        overlay.addEventListener('click', () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            overlay.style.opacity = 0; setTimeout(()=>overlay.remove(), 800);
            animate();
        });

        // --- FIREBASE CHAT LOGIC ---
        window.addEventListener('firebase-ready', () => {
            if(!window.db) { alert("ERROR: Paste kode Firebase dulu!"); return; }

            const feedDiv = document.getElementById('feed');
            const nameIn = document.getElementById('name-input');
            const msgIn = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            const wishesRef = window.ref(window.db, 'gala_party_2026');

            sendBtn.onclick = () => {
                const name = nameIn.value.trim().toUpperCase() || "ANONIM";
                const msg = msgIn.value.trim();
                if(!msg) return;

                window.push(wishesRef, { name: name, message: msg, likes: 0, timestamp: Date.now() });
                msgIn.value = "";
                header.classList.add('shake'); setTimeout(()=>header.classList.remove('shake'), 300);
            };

            window.onChildAdded(wishesRef, (snapshot) => {
                const data = snapshot.val();
                const key = snapshot.key;
                
                if(feedDiv.innerText.includes("Belum ada")) feedDiv.innerHTML = "";

                const div = document.createElement('div');
                div.className = 'wish-card';
                div.id = `card-${key}`;
                div.innerHTML = `
                    <div class="card-header">
                        <span class="sender-name">${escapeHtml(data.name)}</span>
                        <span class="timestamp">${new Date(data.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="card-body">${escapeHtml(data.message)}</div>
                    <div class="reply-container" id="reply-list-${key}"></div>
                    <div class="card-actions">
                        <div class="action-btn" onclick="likePost('${key}')">
                            <span id="heart-${key}">♡</span> <span id="likes-${key}">${data.likes||0}</span>
                        </div>
                        <div class="action-btn" onclick="toggleReply('${key}')">↩ Balas</div>
                    </div>
                    <div class="reply-input-box" id="reply-box-${key}">
                        <input type="text" class="reply-in" id="reply-input-${key}" placeholder="Balas...">
                        <button class="reply-btn" onclick="sendReply('${key}')">></button>
                    </div>
                `;
                feedDiv.appendChild(div);
                feedDiv.scrollTop = feedDiv.scrollHeight;

                if(data.replies) Object.values(data.replies).forEach(r => renderReply(key, r));
                createExplosion(Math.random()*canvas.width, Math.random()*canvas.height/2);
                playSound('pop');
            });
        });

        window.likePost = (key) => {
            const heart = document.getElementById(`heart-${key}`);
            const count = document.getElementById(`likes-${key}`);
            if(heart.innerText === '♡') {
                heart.innerText = '♥'; heart.classList.add('liked');
                count.innerText = parseInt(count.innerText) + 1;
                window.runTransaction(window.ref(window.db, `gala_party_2026/${key}/likes`), (c) => (c||0)+1);
                createExplosion(window.innerWidth/2, window.innerHeight/2, '#ff0000');
            }
        };

        window.toggleReply = (key) => {
            const box = document.getElementById(`reply-box-${key}`);
            box.classList.toggle('show');
        };

        window.sendReply = (key) => {
            const input = document.getElementById(`reply-input-${key}`);
            const text = input.value.trim();
            const name = document.getElementById('name-input').value.trim().toUpperCase() || "ANONIM";
            if(!text) return;

            window.push(window.ref(window.db, `gala_party_2026/${key}/replies`), {name, text});
            renderReply(key, {name, text});
            input.value = "";
            document.getElementById(`reply-box-${key}`).classList.remove('show');
        };

        function renderReply(key, data) {
            const cont = document.getElementById(`reply-list-${key}`);
            cont.style.display = 'block';
            const div = document.createElement('div');
            div.className = 'reply-item';
            div.innerHTML = `<b>${escapeHtml(data.name)}:</b> ${escapeHtml(data.text)}`;
            cont.appendChild(div);
        }

        function escapeHtml(text) { return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
    </script>
</body>
</html>
