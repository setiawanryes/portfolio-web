<!DOCTYPE html>
<html lang="id">
<head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, arrayUnion, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIG AMAN
        const firebaseConfig = {
            apiKey: "AIzaSyBGS2_U6M-lC0YozJd0FCHpncyNLE1mE2g",
            authDomain: "portfolio-setiawanryes.firebaseapp.com",
            projectId: "portfolio-setiawanryes",
            storageBucket: "portfolio-setiawanryes.firebasestorage.app",
            messagingSenderId: "171755400027",
            appId: "1:171755400027:web:6bbbbbda56613af0b4087e",

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.collection = collection; window.addDoc = addDoc; window.onSnapshot = onSnapshot;
        window.doc = doc; window.updateDoc = updateDoc; window.arrayUnion = arrayUnion;
        window.increment = increment; window.query = query; window.orderBy = orderBy;
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
        
        :root {
            --neon-gold: #ffd700;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --dark-bg: #050505;
            --glass: rgba(20, 20, 30, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--dark-bg);
            color: white; height: 100vh; overflow: hidden; font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

        /* HEADER AREA */
        .header-container {
            z-index: 10; padding: 10px 15px; text-align: center; flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        /* HOLO CLOCK (YANG TADI ILANG) */
        .system-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; margin-bottom: 10px;
            font-family: 'Orbitron'; font-size: 0.7rem; color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue); letter-spacing: 1px;
        }
        #holo-clock { font-weight: bold; animation: blink 1s infinite alternate; }
        .live-badge { background: red; color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.6rem; box-shadow: 0 0 10px red; }

        .title {
            font-family: 'Orbitron', sans-serif; color: var(--neon-gold); font-size: 1rem; letter-spacing: 4px; font-weight: 900;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }
        .year {
            font-size: 3rem; font-weight: 900; line-height: 1; margin: 5px 0 10px 0; font-family: 'Orbitron';
            background: linear-gradient(180deg, #fff, var(--neon-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
        }

        /* SLIDER CARD */
        .slider-wrapper {
            width: 100%; max-width: 500px; height: 70px; margin: 0 auto; position: relative;
            perspective: 1000px;
        }
        .roast-card {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 5px 20px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1) inset;
            transform-style: preserve-3d;
            animation: holograph 5s infinite;
        }
        .roast-title { color: var(--neon-pink); font-family: 'Orbitron'; font-size: 0.75rem; font-weight: bold; letter-spacing: 1px; }
        .roast-content { color: #eee; font-size: 0.9rem; font-style: italic; text-align: center; }

        @keyframes holograph {
            0% { opacity: 0; transform: rotateX(90deg); }
            10% { opacity: 1; transform: rotateX(0deg); }
            90% { opacity: 1; transform: rotateX(0deg); }
            100% { opacity: 0; transform: rotateX(-90deg); }
        }

        /* FEED CHAT */
        .feed-container {
            flex: 1; overflow-y: auto; padding: 15px; z-index: 10;
            display: flex; flex-direction: column; gap: 15px;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            scrollbar-width: none; padding-bottom: 160px;
            -webkit-overflow-scrolling: touch;
        }
        
        .wish-card {
            background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            padding: 12px; animation: slideInLeft 0.4s ease-out;
            max-width: 600px; margin: 0 auto; width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex; gap: 10px; align-items: flex-start;
            position: relative; overflow: hidden;
        }

        /* SPECIAL ADMIN EFFECT (RGB BORDER) */
        .wish-card.admin-card {
            border: 2px solid transparent;
            background-clip: padding-box, border-box;
            background-origin: padding-box, border-box;
            background-image: linear-gradient(#1a1a2e, #1a1a2e), linear-gradient(90deg, #ff0000, #00ff00, #0000ff, #ff0000);
            background-size: 300% 300%;
            animation: rgbLoop 3s linear infinite, slideInLeft 0.4s ease-out;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        @keyframes rgbLoop { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        /* Avatar */
        .avatar {
            width: 35px; height: 35px; border-radius: 8px;
            background: linear-gradient(135deg, #00f3ff, #bc13fe);
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: black; font-family: 'Orbitron'; font-size: 0.9rem;
            flex-shrink: 0; box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .card-content { flex: 1; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .sender-name { color: var(--neon-gold); font-weight: 700; font-size: 0.9rem; font-family: 'Orbitron'; letter-spacing: 0.5px; }
        .verified { color: #00f3ff; font-size: 0.9rem; filter: drop-shadow(0 0 5px #00f3ff); margin-left: 5px;}
        .timestamp { font-size: 0.6rem; opacity: 0.5; font-family: 'Orbitron'; }
        .card-body { font-size: 0.95rem; color: #fff; line-height: 1.4; font-weight: 500; }
        
        .card-actions { display: flex; gap: 15px; margin-top: 8px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.75rem; color: #aaa; }
        .action-btn { cursor: pointer; display: flex; align-items: center; gap: 4px; transition: 0.2s; }
        .action-btn:hover { color: white; text-shadow: 0 0 5px white; }
        .liked { color: #ff0055; font-weight: bold; text-shadow: 0 0 10px #ff0055; }

        /* Reply */
        .reply-container { margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.4); border-radius: 6px; display: none; border-left: 2px solid var(--neon-blue); }
        .reply-item { font-size: 0.8rem; color: #ccc; margin-bottom: 4px; }
        .reply-input-box { display: none; margin-top: 8px; gap: 5px; }
        .reply-input-box.show { display: flex; }
        .reply-in { flex: 1; background: rgba(255,255,255,0.1); border: none; color: white; padding: 6px 10px; border-radius: 4px; font-size: 0.8rem; }
        .reply-btn { background: var(--neon-blue); color: black; border: none; padding: 0 10px; font-weight: bold; cursor: pointer; border-radius: 4px; }

        /* BOTTOM PANEL */
        .bottom-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 50;
            display: flex; flex-direction: column; align-items: center;
            background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(15px);
            border-top: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }

        /* FLOATING EMOJI CONTAINER */
        #floating-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; overflow: hidden; }
        .float-emoji { position: absolute; bottom: -50px; font-size: 2rem; animation: floatUp 3s linear forwards; opacity: 0; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 100% { transform: translateY(-80vh) scale(1.2); opacity: 0; } }

        /* REACTION BAR */
        .reaction-bar {
            display: flex; gap: 20px; margin-bottom: 10px; padding: 10px 25px;
            background: rgba(255,255,255,0.05); border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            transform: translateY(-10px);
        }
        .react-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s; }
        .react-btn:hover { transform: scale(1.5) rotate(15deg); }

        .input-wrapper { width: 100%; padding: 0 20px 15px; display: flex; justify-content: center; }
        .input-group { display: flex; gap: 8px; width: 100%; max-width: 650px; }
        
        #name-input { 
            width: 25%; background: rgba(0,0,0,0.5); border: 1px solid var(--neon-gold); 
            color: var(--neon-gold); font-weight: 700; border-radius: 8px; padding: 12px; 
            text-align: center; font-family: 'Orbitron';
        }
        #msg-input { 
            flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); 
            color: white; border-radius: 8px; padding: 12px; font-family: 'Rajdhani'; font-size: 1rem;
        }
        input:focus { border-color: var(--neon-blue) !important; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        
        #send-btn { 
            background: var(--neon-gold); border: none; border-radius: 8px; width: 50px; 
            cursor: pointer; font-size: 1.5rem; color: black; font-weight: 900;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%, 0 20%);
        }

        /* OVERLAY */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; transition: 0.8s ease-in-out;
        }
        .btn-start {
            padding: 15px 40px; border: 2px solid var(--neon-blue); color: var(--neon-blue); 
            font-family: 'Orbitron'; font-weight: 900; font-size: 1.2rem; border-radius: 0; 
            letter-spacing: 4px; background: rgba(0, 243, 255, 0.1); 
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            animation: pulseBtn 1s infinite alternate;
        }
        @keyframes pulseBtn { from { box-shadow: 0 0 10px var(--neon-blue); } to { box-shadow: 0 0 30px var(--neon-blue); } }
        @keyframes slideInLeft { from { opacity:0; transform: translateX(-20px); } to { opacity:1; transform: translateX(0); } }
        .shake { animation: shakeAnim 0.3s; }
        @keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
    </style>
</head>
<body>

    <div id="floating-container"></div>
    <div id="overlay">
        <div class="btn-start">INITIALIZE SYSTEM</div>
        <p style="color:var(--neon-pink); margin-top:20px; font-family:'Orbitron'; font-size:0.7rem; letter-spacing: 2px;">[ TAP ANYWHERE ]</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="header-container" id="main-header">
        <div class="system-bar">
            <div id="holo-clock">00:00:00</div>
            <div class="live-badge">● LIVE</div>
        </div>
        <div class="title">RONI'S GALA</div>
        <div class="year">2026</div>
        <div class="slider-wrapper" id="slider-container"></div>
    </div>

    <div class="feed-container" id="feed">
        <div style="text-align:center; color:rgba(255,255,255,0.3); margin-top:80px; font-style: italic;">
            <div style="font-size: 3rem; margin-bottom: 15px; opacity:0.7; filter: drop-shadow(0 0 10px var(--neon-blue));">📡</div>
            Waiting for signal...<br>Be the first one!
        </div>
    </div>

    <div class="bottom-panel">
        <div class="reaction-bar">
            <button class="react-btn" onclick="quickReact('🔥')">🔥</button>
            <button class="react-btn" onclick="quickReact('❤️')">❤️</button>
            <button class="react-btn" onclick="quickReact('🎉')">🎉</button>
            <button class="react-btn" onclick="quickReact('🚀')">🚀</button>
            <button class="react-btn" onclick="quickReact('🥂')">🥂</button>
        </div>

        <div class="input-wrapper">
            <div class="input-group">
                <input type="text" id="name-input" placeholder="CODENAME" maxlength="12">
                <input type="text" id="msg-input" placeholder="Type your wish...">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        // --- HOLO CLOCK (REALTIME) ---
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-GB', { hour12: false });
            document.getElementById('holo-clock').innerText = "SYSTEM TIME: " + timeString;
        }
        setInterval(updateClock, 1000); updateClock();

        // --- SLIDER DATA ---
        const roastData = [
            { title: "RONI SETIAWAN", text: "Selamat Tahun Baru 2026! Semoga tahun ini rezekinya 'gacor' dan dijauhkan dari teman yang suka 'pinjam dulu seratus'." },
            { title: "GEN 98+", text: "Udah 2026 woy! Jangan cuma kondangan mulu, kapan ngundangnya? 🤣" },
            { title: "RESOLUSI 2026", text: "Jadi kaya raya tanpa harus ikut pesugihan. Rebahan, tapi saldo nambah terus." },
            { title: "PANTUN", text: "Makan ketan di pinggir jalan, mantan lewat tolong abaikan. Tahun depan ayo nikahan! Wkwk." },
            { title: "REALITA KERJA", text: "Semoga tahun ini kerjanya remote, gajinya dollar, tapi pengeluaran tetap rupiah warteg." },
            { title: "TIM JOMBLO", text: "Resolusi 2026, Berhenti jadi 'penjaga jodoh orang'. Saatnya jadi pemeran utama!" },
            { title: "KEUANGAN", text: "Ya Allah, semoga tahun ini dompet hamba setebal harapan orang tua hamba kepada hamba." },
            { title: "AAMIIN", text: "Semoga semua yang baca ini sehat selalu, sukses karirnya, dan bahagia terus. Gas 2026!" }
        ];

        let sliderIndex = 0;
        const sliderContainer = document.getElementById('slider-container');
        function showNextCard() {
            const item = roastData[sliderIndex];
            sliderContainer.innerHTML = '';
            const card = document.createElement('div');
            card.className = 'roast-card';
            card.innerHTML = `<div class="roast-title">[ ${item.title} ]</div><div class="roast-content">"${item.text}"</div>`;
            sliderContainer.appendChild(card);
            sliderIndex = (sliderIndex + 1) % roastData.length;
        }
        showNextCard(); setInterval(showNextCard, 5000);

        // --- VISUAL (SHOOTING STARS & INTERACTIVE) ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const header = document.getElementById('main-header');
        let audioCtx;
        let mouse = { x: undefined, y: undefined };

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });

        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            if(type === 'boom') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else { 
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const a = Math.random() * 6.28; const s = Math.random() * 5 + 2;
                this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
                this.life = 1; this.decay = Math.random() * 0.015 + 0.01;
                this.gravity = 0.05;
            }
            update() {
                this.x += this.vx; this.y += this.vy; this.vy += this.gravity; this.life -= this.decay;
                if(mouse.x) { // Repulsion Effect
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx*dx + dy*dy);
                    if(distance < 100) {
                        const force = (100 - distance) / 100;
                        this.x -= (dx/distance) * force * 5; this.y -= (dy/distance) * force * 5;
                    }
                }
            }
            draw() { 
                ctx.globalAlpha = this.life; ctx.fillStyle = this.color; 
                ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, 6.28); ctx.fill(); 
            }
        }
        
        // Shooting Star
        let shootingStars = [];
        class ShootingStar {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width; this.y = 0;
                this.len = Math.random() * 80 + 10; this.speed = Math.random() * 10 + 6;
                this.size = Math.random() * 1 + 0.1; this.waitTime = new Date().getTime() + Math.random() * 3000 + 500;
                this.active = false;
            }
            update() {
                if (this.active) {
                    this.x -= this.speed; this.y += this.speed;
                    if (this.x < 0 || this.y >= canvas.height) { this.active = false; this.waitTime = new Date().getTime() + Math.random() * 3000 + 500; }
                } else {
                    if (this.waitTime < new Date().getTime()) { this.active = true; }
                }
            }
            draw() {
                if (this.active) {
                    ctx.strokeStyle = "rgba(255, 255, 255, " + Math.random() + ")";
                    ctx.lineWidth = this.size; ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + this.len, this.y - this.len); ctx.stroke();
                }
            }
        }
        for (let i = 0; i < 5; i++) shootingStars.push(new ShootingStar());

        let particles = [];
        let stars = [];
        for(let i=0; i<100; i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2});
        
        function createExplosion(x, y, color) {
            playSound('boom');
            const colors = ['#ffd700', '#ffffff', '#ff00ff', '#00f3ff'];
            const c = color || colors[Math.floor(Math.random() * colors.length)];
            for(let i=0; i<40; i++) particles.push(new Particle(x, y, c));
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.2)'; ctx.fillRect(0,0,canvas.width, canvas.height);
            stars.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${Math.random()})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.28); ctx.fill(); });
            shootingStars.forEach(s => { s.update(); s.draw(); });
            particles.forEach((p,i) => { p.update(); p.draw(); if(p.life<=0) particles.splice(i,1); });
            if(Math.random() < 0.01) createExplosion(Math.random()*canvas.width, Math.random()*canvas.height*0.6);
            requestAnimationFrame(animate);
        }

        overlay.addEventListener('click', () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            overlay.style.opacity = 0; setTimeout(()=>overlay.remove(), 800); animate();
        });

        // --- FIRESTORE LOGIC ---
        window.addEventListener('firebase-ready', () => {
            const feedDiv = document.getElementById('feed');
            const nameIn = document.getElementById('name-input');
            const msgIn = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            
            const colRef = window.collection(window.db, 'gala_party_2026');
            const q = window.query(colRef, window.orderBy('timestamp', 'asc'));

            if(localStorage.getItem('chatName')) nameIn.value = localStorage.getItem('chatName');

            window.onSnapshot(q, (snapshot) => {
                if(feedDiv.innerText.includes("Waiting")) feedDiv.innerHTML = "";

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        const key = change.doc.id;

                        // AVATAR
                        const initial = data.name.charAt(0).toUpperCase();
                        const colors = ['#FF0099', '#493240', '#FFD700', '#00F3FF', '#7B1FA2'];
                        const bgAvatar = colors[initial.charCodeAt(0) % colors.length];

                        // ADMIN EFFECT
                        let nameDisplay = escapeHtml(data.name);
                        let specialClass = '';
                        if(nameDisplay === "RONI SETIAWAN") {
                            nameDisplay += ' <span class="verified">✓</span>';
                            specialClass = 'admin-card';
                        }

                        const div = document.createElement('div');
                        div.className = `wish-card ${specialClass}`;
                        div.id = `card-${key}`;
                        div.innerHTML = `
                            <div class="avatar" style="background:${bgAvatar}">${initial}</div>
                            <div class="card-content">
                                <div class="card-header">
                                    <span class="sender-name">${nameDisplay}</span>
                                    <span class="timestamp">${new Date(data.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                                </div>
                                <div class="card-body">${escapeHtml(data.message)}</div>
                                <div class="reply-container" id="reply-list-${key}"></div>
                                <div class="card-actions">
                                    <div class="action-btn" onclick="likePost('${key}')">
                                        <span id="heart-${key}" style="font-size:1.2rem">♡</span> <span id="likes-${key}">${data.likes||0}</span>
                                    </div>
                                    <div class="action-btn" onclick="toggleReply('${key}')" style="color:var(--neon-blue)">↩ Reply</div>
                                </div>
                                <div class="reply-input-box" id="reply-box-${key}">
                                    <input type="text" class="reply-in" id="reply-input-${key}" placeholder="Reply...">
                                    <button class="reply-btn" onclick="sendReply('${key}')">></button>
                                </div>
                            </div>
                        `;
                        feedDiv.appendChild(div);
                        feedDiv.scrollTop = feedDiv.scrollHeight;

                        if(data.replies) data.replies.forEach(r => renderReply(key, r));
                        createExplosion(Math.random()*canvas.width, Math.random()*canvas.height/2);
                        playSound('pop');
                    }
                    if (change.type === "modified") {
                        const data = change.doc.data();
                        const key = change.doc.id;
                        document.getElementById(`likes-${key}`).innerText = data.likes || 0;
                        const cont = document.getElementById(`reply-list-${key}`);
                        cont.innerHTML = "";
                        if(data.replies) {
                            data.replies.forEach(r => renderReply(key, r));
                            cont.style.display = "block";
                        }
                    }
                });
            });

            sendBtn.onclick = async () => {
                const name = nameIn.value.trim().toUpperCase() || "ANONIM";
                const msg = msgIn.value.trim();
                if(!msg) return;
                localStorage.setItem('chatName', name);

                try {
                    await window.addDoc(colRef, { name: name, message: msg, likes: 0, replies: [], timestamp: Date.now() });
                    msgIn.value = "";
                    header.classList.add('shake'); setTimeout(()=>header.classList.remove('shake'), 400);
                    createExplosion(window.innerWidth/2, window.innerHeight - 100, '#ffd700');
                } catch (e) { alert("Gagal kirim: " + e.message); }
            };

            // QUICK REACT (FLOATING EMOJI)
            window.quickReact = async (emoji, text) => {
                // Floating Animation
                const floatContainer = document.getElementById('floating-container');
                const el = document.createElement('div');
                el.innerText = emoji;
                el.className = 'float-emoji';
                el.style.left = Math.random() * 80 + 10 + '%';
                floatContainer.appendChild(el);
                setTimeout(() => el.remove(), 3000);

                const name = nameIn.value.trim().toUpperCase() || "ANONIM";
                const msg = text ? `${emoji} ${text}` : emoji;
                localStorage.setItem('chatName', name);
                createExplosion(window.innerWidth/2, window.innerHeight/2, '#00f3ff');
                try {
                    await window.addDoc(colRef, { name: name, message: msg, likes: 0, replies: [], timestamp: Date.now() });
                } catch (e) { console.log(e); }
            };
        });

        window.likePost = (key) => {
            const heart = document.getElementById(`heart-${key}`);
            if(heart.innerText === '♡') {
                heart.innerText = '♥'; heart.classList.add('liked');
                const docRef = window.doc(window.db, 'gala_party_2026', key);
                window.updateDoc(docRef, { likes: window.increment(1) });
                createExplosion(window.innerWidth/2, window.innerHeight/2, '#ff00ff');
                
                // Float emoji heart
                const floatContainer = document.getElementById('floating-container');
                const el = document.createElement('div');
                el.innerText = '❤️'; el.className = 'float-emoji';
                el.style.left = Math.random() * 80 + 10 + '%';
                floatContainer.appendChild(el);
                setTimeout(() => el.remove(), 3000);
            }
        };

        window.toggleReply = (key) => { document.getElementById(`reply-box-${key}`).classList.toggle('show'); };

        window.sendReply = (key) => {
            const input = document.getElementById(`reply-input-${key}`);
            const text = input.value.trim();
            const name = document.getElementById('name-input').value.trim().toUpperCase() || "ANONIM";
            if(!text) return;
            const docRef = window.doc(window.db, 'gala_party_2026', key);
            window.updateDoc(docRef, { replies: window.arrayUnion({ name, text }) });
            input.value = "";
            document.getElementById(`reply-box-${key}`).classList.remove('show');
        };

        function renderReply(key, data) {
            const cont = document.getElementById(`reply-list-${key}`);
            cont.style.display = 'block';
            const div = document.createElement('div');
            div.className = 'reply-item';
            div.innerHTML = `<b style="color:var(--neon-blue)">${escapeHtml(data.name)}:</b> ${escapeHtml(data.text)}`;
            cont.appendChild(div);
        }
        function escapeHtml(text) { return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
    </script>
</body>
</html>
