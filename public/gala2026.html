<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RONI'S GALA 2026 - CYBER HOLO</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, arrayUnion, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ✅ CONFIG AMAN
        const firebaseConfig = {
            apiKey: "AIzaSyBGS2_U6M-lC0YozJd0FCHpncyNLE1mE2g",
            authDomain: "portfolio-setiawanryes.firebaseapp.com",
            projectId: "portfolio-setiawanryes",
            storageBucket: "portfolio-setiawanryes.firebasestorage.app",
            messagingSenderId: "171755400027",
            appId: "1:171755400027:web:6bbbbbda56613af0b4087e",
            measurementId: "G-4R3C18RXW0"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.collection = collection; window.addDoc = addDoc; window.onSnapshot = onSnapshot;
        window.doc = doc; window.updateDoc = updateDoc; window.arrayUnion = arrayUnion;
        window.increment = increment; window.query = query; window.orderBy = orderBy;
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
        
        :root {
            --cyan: #00f3ff;
            --purple: #bc13fe;
            --pink: #ff0055;
            --gold: #ffd700;
            --dark: #050508;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--dark);
            color: white; height: 100vh; overflow: hidden; 
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column;
        }

        /* BACKGROUND GRID SYNTHWAVE */
        .cyber-grid {
            position: fixed; width: 200vw; height: 200vh;
            top: -50%; left: -50%;
            background-image: 
                linear-gradient(rgba(188, 19, 254, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 20s linear infinite;
            z-index: 0; pointer-events: none; opacity: 0.2;
        }
        @keyframes gridMove { 0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 100% { transform: perspective(500px) rotateX(60deg) translateY(50px); } }

        canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }

        /* HEADER GLITCH */
        .header-container {
            z-index: 10; padding: 20px 15px 5px; text-align: center; flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(5,5,8,0.95), transparent);
            border-bottom: 2px solid var(--cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            position: relative;
        }
        
        /* Glitch Title Effect */
        .glitch-wrapper { position: relative; display: inline-block; }
        .title {
            font-family: 'Orbitron', sans-serif; color: var(--cyan); font-size: 1.2rem; letter-spacing: 3px; font-weight: 900;
            text-shadow: 2px 2px var(--purple); position: relative;
        }
        .title::before, .title::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8;
        }
        .title::before { color: var(--pink); z-index: -1; animation: glitch-anim-1 2s infinite linear alternate-reverse; }
        .title::after { color: var(--gold); z-index: -2; animation: glitch-anim-2 3s infinite linear alternate-reverse; }
        
        @keyframes glitch-anim-1 { 0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px,0); } 100% { clip-path: inset(60% 0 10% 0); transform: translate(2px,0); } }
        @keyframes glitch-anim-2 { 0% { clip-path: inset(10% 0 60% 0); transform: translate(2px,0); } 100% { clip-path: inset(80% 0 5% 0); transform: translate(-2px,0); } }

        .year {
            font-size: 3.5rem; font-weight: 900; line-height: 1; margin: 5px 0 10px 0; font-family: 'Orbitron';
            background: linear-gradient(180deg, #fff, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px var(--gold));
        }

        /* SLIDER HOLOGRAPHIC */
        .slider-wrapper {
            width: 100%; max-width: 500px; height: 80px; margin: 0 auto; position: relative;
        }
        .roast-card {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px; padding: 5px 15px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1) inset;
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%); /* Sudut tech */
            animation: holoFade 5s infinite;
        }
        .roast-title { color: var(--pink); font-family: 'Orbitron'; font-size: 0.8rem; font-weight: bold; letter-spacing: 1px; }
        .roast-content { color: #eee; font-size: 0.9rem; font-style: italic; text-align: center; }
        
        @keyframes holoFade { 0%,100% { opacity:0; transform:scale(0.9); } 10%,90% { opacity:1; transform:scale(1); } }

        /* FEED AREA */
        .feed-container {
            flex: 1; overflow-y: auto; padding: 15px; z-index: 10;
            display: flex; flex-direction: column; gap: 15px;
            padding-bottom: 100px; -webkit-overflow-scrolling: touch;
        }
        
        .wish-card {
            background: rgba(10, 10, 20, 0.7); backdrop-filter: blur(8px);
            border-left: 4px solid var(--cyan);
            border-right: 1px solid rgba(255,255,255,0.1);
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 12px; border-radius: 4px 15px 4px 15px;
            animation: slideInLeft 0.3s ease-out;
            position: relative; overflow: hidden;
        }
        /* Efek Kilau Hologram pas Hover */
        .wish-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }
        .wish-card:hover::before { left: 100%; }
        
        @keyframes slideInLeft { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }

        .sender-name { color: var(--cyan); font-weight: 800; font-size: 1rem; font-family: 'Orbitron'; text-shadow: 0 0 5px var(--cyan); }
        .timestamp { font-size: 0.7rem; color: #666; font-family: 'Rajdhani'; font-weight: 600; }
        .card-body { font-size: 1.1rem; color: #fff; line-height: 1.4; margin-top: 5px; font-weight: 500; }
        
        .card-actions { display: flex; gap: 15px; margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 8px; }
        .action-btn { color: #888; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .action-btn:hover { color: white; }
        .liked { color: var(--pink) !important; text-shadow: 0 0 8px var(--pink); }

        /* Reply */
        .reply-container { margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 5px; display: none; border-left: 2px solid var(--purple); }
        .reply-item { font-size: 0.9rem; color: #ccc; margin-bottom: 4px; }
        .reply-input-box { display: none; margin-top: 10px; gap: 5px; }
        .reply-input-box.show { display: flex; }
        .reply-in { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--purple); color: white; padding: 8px; border-radius: 4px; }
        .reply-btn { background: var(--purple); border: none; color: white; padding: 0 15px; font-weight: bold; cursor: pointer; clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%, 0 20%); }

        /* INPUT HUD */
        .input-wrapper {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(10px);
            padding: 15px; border-top: 2px solid var(--cyan);
            z-index: 50; display: flex; justify-content: center;
            box-shadow: 0 -10px 30px rgba(0, 243, 255, 0.1);
        }
        .input-group { display: flex; gap: 8px; width: 100%; max-width: 650px; }
        
        #name-input { 
            width: 28%; background: #000; border: 1px solid var(--cyan); 
            color: var(--gold); font-weight: 700; padding: 12px; text-align: center; 
            font-family: 'Orbitron'; clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
        }
        #msg-input { 
            flex: 1; background: #000; border: 1px solid var(--purple); 
            color: white; padding: 12px; font-family: 'Rajdhani'; font-size: 1rem;
            clip-path: polygon(2% 0, 100% 0, 100% 80%, 98% 100%, 0 100%, 0 20%);
        }
        #send-btn { 
            background: var(--cyan); border: none; width: 55px; cursor: pointer; 
            font-size: 1.5rem; color: #000; font-weight: 900;
            clip-path: polygon(20% 0, 100% 0, 100% 100%, 0 100%, 0 20%);
            transition: 0.2s;
        }
        #send-btn:active { transform: scale(0.9); background: var(--pink); color: white; }

        /* Sound Toggle */
        .sound-toggle {
            position: absolute; top: 15px; right: 15px; z-index: 20;
            background: rgba(0,0,0,0.5); border: 1px solid var(--cyan); color: var(--cyan);
            padding: 5px 10px; font-size: 0.8rem; cursor: pointer; border-radius: 4px;
        }

        /* OVERLAY */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; transition: 0.8s;
        }
        .btn-start {
            padding: 15px 40px; border: 2px solid var(--cyan); color: var(--cyan); 
            font-family: 'Orbitron'; font-size: 1.5rem; letter-spacing: 2px;
            background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 20px var(--cyan);
            clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%);
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { box-shadow: 0 0 10px var(--cyan); } to { box-shadow: 0 0 30px var(--cyan), 0 0 10px white; } }
        .shake { animation: shakeAnim 0.3s; }
        @keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <div id="overlay">
        <div class="btn-start">INITIALIZE SYSTEM</div>
        <p style="color:var(--purple); margin-top:20px; font-family:'Orbitron'; font-size:0.8rem;">[ CLICK TO CONNECT ]</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="header-container" id="main-header">
        <div class="sound-toggle" id="sound-btn">🔇 MUTE</div>
        <div class="glitch-wrapper">
            <div class="title" data-text="LIVE SYSTEM 2026">LIVE SYSTEM 2026</div>
        </div>
        <div class="year">2026</div>
        <div class="slider-wrapper" id="slider-container"></div>
    </div>

    <div class="feed-container" id="feed">
        <div style="text-align:center; color:rgba(255,255,255,0.3); margin-top:80px;">
            <div style="font-size: 4rem; margin-bottom: 10px; filter: drop-shadow(0 0 10px var(--cyan));">📡</div>
            WAITING FOR SIGNAL...<br>Jadilah yang pertama!
        </div>
    </div>

    <div class="input-wrapper">
        <div class="input-group">
            <input type="text" id="name-input" placeholder="CODENAME" maxlength="10">
            <input type="text" id="msg-input" placeholder="INPUT DATA...">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script>
        // --- DATA ROASTING ---
        const roastData = [
            { title: "RONI SETIAWAN", text: "Selamat Tahun Baru 2026! Semoga tahun ini rezekinya 'gacor' dan dijauhkan dari teman yang suka 'pinjam dulu seratus'." },
            { title: "GEN 98+", text: "Udah 2026 woy! Jangan cuma kondangan mulu, kapan ngundangnya? 🤣" },
            { title: "RESOLUSI 2026", text: "Jadi kaya raya tanpa harus ikut pesugihan. Rebahan, tapi saldo nambah terus. Aminin yang kenceng!" },
            { title: "PANTUN", text: "Makan ketan di pinggir jalan, mantan lewat tolong abaikan. Tahun depan ayo nikahan, biar gak jadi beban pikiran! Wkwk." },
            { title: "REALITA KERJA", text: "Semoga tahun ini kerjanya remote, gajinya dollar, tapi pengeluaran tetap rupiah warteg." },
            { title: "TIM JOMBLO", text: "Resolusi 2026, Berhenti jadi 'penjaga jodoh orang'. Saatnya jadi pemeran utama!" },
            { title: "KEUANGAN", text: "Ya Allah, semoga tahun ini dompet hamba setebal harapan orang tua hamba kepada hamba." },
            { title: "HOPE", text: "Diet wacana sudah berlalu, tahun ini body goals harus jadi nomor satu." },
            { title: "GEN Z", text: "Mental aman? Semoga tahun ini ga dikit-dikit 'Burnout' padahal baru kerja 5 menit. Semangat!" },
            { title: "SANDWICH GEN", text: "Semoga punggung kita sekuat baja menahan beban keluarga, bukan encok mikirin cicilan Paylater." },
            { title: "TIPS SUKSES", text: "Kerja keras itu penting, tapi kerja cerdas (baca: cari orang dalem) lebih penting. Canda orang dalem! ✌️" },
            { title: "AAMIIN", text: "Semoga semua yang baca ini sehat selalu, sukses karirnya, dan bahagia terus. Gas 2026!" }
        ];

        let sliderIndex = 0;
        const sliderContainer = document.getElementById('slider-container');
        function showNextCard() {
            const item = roastData[sliderIndex];
            sliderContainer.innerHTML = '';
            const card = document.createElement('div');
            card.className = 'roast-card';
            card.innerHTML = `<div class="roast-title">[ ${item.title} ]</div><div class="roast-content">"${item.text}"</div>`;
            sliderContainer.appendChild(card);
            sliderIndex = (sliderIndex + 1) % roastData.length;
        }
        showNextCard(); setInterval(showNextCard, 5000);

        // --- VISUAL & AUDIO ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const header = document.getElementById('main-header');
        let audioCtx;
        let isMuted = false;

        document.getElementById('sound-btn').onclick = () => {
            isMuted = !isMuted;
            document.getElementById('sound-btn').innerText = isMuted ? "🔇 MUTE" : "🔊 ON";
        };

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function playSound(type) {
            if(!audioCtx || isMuted) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            if(type === 'boom') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else { 
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        // Cyber Particles
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const a = Math.random() * 6.28; const s = Math.random() * 8 + 2;
                this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
                this.life = 1; this.decay = Math.random() * 0.02 + 0.01;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
            draw() { 
                ctx.globalAlpha = this.life; ctx.fillStyle = this.color; 
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, 3, 3); // Kotak pixel art
            }
        }
        let particles = [];
        
        function createExplosion(x, y, color) {
            playSound('boom');
            const colors = ['#00f3ff', '#bc13fe', '#ffd700', '#ff0055'];
            const c = color || colors[Math.floor(Math.random() * colors.length)];
            for(let i=0; i<40; i++) particles.push(new Particle(x, y, c));
        }

        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach((p,i) => { p.update(); p.draw(); if(p.life<=0) particles.splice(i,1); });
            if(Math.random() < 0.02) createExplosion(Math.random()*canvas.width, Math.random()*canvas.height*0.7);
            requestAnimationFrame(animate);
        }

        overlay.addEventListener('click', () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            overlay.style.opacity = 0; setTimeout(()=>overlay.remove(), 800); animate();
        });

        // --- FIREBASE ---
        window.addEventListener('firebase-ready', () => {
            const feedDiv = document.getElementById('feed');
            const nameIn = document.getElementById('name-input');
            const msgIn = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            
            const colRef = window.collection(window.db, 'gala_party_2026');
            const q = window.query(colRef, window.orderBy('timestamp', 'asc'));

            // AUTO LOAD NAME
            if(localStorage.getItem('chatName')) nameIn.value = localStorage.getItem('chatName');

            // LISTEN
            window.onSnapshot(q, (snapshot) => {
                if(feedDiv.innerText.includes("WAITING")) feedDiv.innerHTML = "";

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        const key = change.doc.id;

                        const div = document.createElement('div');
                        div.className = 'wish-card';
                        div.id = `card-${key}`;
                        div.innerHTML = `
                            <div class="card-header">
                                <span class="sender-name">⚡ ${escapeHtml(data.name)}</span>
                                <span class="timestamp">${new Date(data.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                            </div>
                            <div class="card-body">${escapeHtml(data.message)}</div>
                            <div class="reply-container" id="reply-list-${key}"></div>
                            <div class="card-actions">
                                <div class="action-btn" onclick="likePost('${key}')">
                                    <span id="heart-${key}" style="font-size:1.2rem">♡</span> <span id="likes-${key}">${data.likes||0}</span>
                                </div>
                                <div class="action-btn" onclick="toggleReply('${key}')" style="color:var(--cyan)">↩ REPLY</div>
                            </div>
                            <div class="reply-input-box" id="reply-box-${key}">
                                <input type="text" class="reply-in" id="reply-input-${key}" placeholder="Type here...">
                                <button class="reply-btn" onclick="sendReply('${key}')">></button>
                            </div>
                        `;
                        feedDiv.appendChild(div);
                        feedDiv.scrollTop = feedDiv.scrollHeight;

                        if(data.replies) data.replies.forEach(r => renderReply(key, r));
                        createExplosion(Math.random()*canvas.width, Math.random()*canvas.height/2);
                        playSound('pop');
                    }
                    if (change.type === "modified") {
                        const data = change.doc.data();
                        const key = change.doc.id;
                        document.getElementById(`likes-${key}`).innerText = data.likes || 0;
                        const cont = document.getElementById(`reply-list-${key}`);
                        cont.innerHTML = "";
                        if(data.replies) {
                            data.replies.forEach(r => renderReply(key, r));
                            cont.style.display = "block";
                        }
                    }
                });
            });

            // SEND
            sendBtn.onclick = async () => {
                const name = nameIn.value.trim().toUpperCase() || "ANONIM";
                const msg = msgIn.value.trim();
                
                if(!msg) return;
                localStorage.setItem('chatName', name);

                try {
                    await window.addDoc(colRef, {
                        name: name, message: msg, likes: 0, replies: [], timestamp: Date.now()
                    });
                    msgIn.value = "";
                    header.classList.add('shake'); setTimeout(()=>header.classList.remove('shake'), 400);
                    createExplosion(window.innerWidth/2, window.innerHeight - 100, '#00f3ff');
                } catch (e) {
                    alert("Error: " + e.message);
                }
            };
        });

        // HELPERS
        window.likePost = (key) => {
            const heart = document.getElementById(`heart-${key}`);
            if(heart.innerText === '♡') {
                heart.innerText = '♥'; heart.classList.add('liked');
                const docRef = window.doc(window.db, 'gala_party_2026', key);
                window.updateDoc(docRef, { likes: window.increment(1) });
                createExplosion(window.innerWidth/2, window.innerHeight/2, '#ff0055');
            }
        };

        window.toggleReply = (key) => {
            document.getElementById(`reply-box-${key}`).classList.toggle('show');
        };

        window.sendReply = (key) => {
            const input = document.getElementById(`reply-input-${key}`);
            const text = input.value.trim();
            const name = document.getElementById('name-input').value.trim().toUpperCase() || "ANONIM";
            if(!text) return;

            const docRef = window.doc(window.db, 'gala_party_2026', key);
            window.updateDoc(docRef, { replies: window.arrayUnion({ name, text }) });
            input.value = "";
            document.getElementById(`reply-box-${key}`).classList.remove('show');
        };

        function renderReply(key, data) {
            const cont = document.getElementById(`reply-list-${key}`);
            cont.style.display = 'block';
            const div = document.createElement('div');
            div.className = 'reply-item';
            div.innerHTML = `<b style="color:var(--purple)">> ${escapeHtml(data.name)}:</b> ${escapeHtml(data.text)}`;
            cont.appendChild(div);
        }
        function escapeHtml(text) { return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
    </script>
</body>
</html>
