<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RONI'S ROYAL GALA - LIVE FIX</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, arrayUnion, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGS2_U6M-lC0YozJd0FCHpncyNLE1mE2g",
            authDomain: "portfolio-setiawanryes.firebaseapp.com",
            projectId: "portfolio-setiawanryes",
            storageBucket: "portfolio-setiawanryes.firebasestorage.app",
            messagingSenderId: "171755400027",
            appId: "1:171755400027:web:6bbbbbda56613af0b4087e",
            measurementId: "G-4R3C18RXW0"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.collection = collection; window.addDoc = addDoc; window.onSnapshot = onSnapshot;
        window.doc = doc; window.updateDoc = updateDoc; window.arrayUnion = arrayUnion;
        window.increment = increment; window.query = query; window.orderBy = orderBy;
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;500;700&display=swap');
        
        :root {
            --gold: #FFD700;
            --accent: #00f3ff;
            --glass-bg: rgba(20, 20, 35, 0.85);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at bottom, #1a0b2e 0%, #000000 100%);
            color: white; height: 100vh; overflow: hidden; font-family: 'Outfit', sans-serif;
            display: flex; flex-direction: column;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

        /* HEADER & LIVE CLOCK */
        .header-container {
            z-index: 10; padding: 10px 15px; text-align: center; flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .live-indicator {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: 'Cinzel'; font-size: 0.8rem; color: var(--accent);
            background: rgba(0, 243, 255, 0.1); padding: 5px 12px; border-radius: 20px;
            border: 1px solid var(--accent); margin-bottom: 5px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }
        .dot { width: 8px; height: 8px; background: red; border-radius: 50%; box-shadow: 0 0 5px red; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .year {
            font-size: 2.8rem; font-weight: 900; line-height: 1; margin: 5px 0 10px 0; font-family: 'Cinzel';
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow { from { filter: drop-shadow(0 0 5px var(--gold)); } to { filter: drop-shadow(0 0 20px var(--gold)); } }

        /* SLIDER CARD */
        .slider-wrapper { width: 100%; max-width: 500px; height: 75px; margin: 0 auto; position: relative; }
        .roast-card {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 12px;
            padding: 5px 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: slideFade 5s infinite;
        }
        .roast-title { color: var(--gold); font-family: 'Cinzel'; font-weight: bold; margin-bottom: 4px; letter-spacing: 1px; }
        .roast-content { font-size: 0.85rem; font-style: italic; text-align: center; color: #fff; text-shadow: 0 1px 2px black; }
        
        @keyframes slideFade { 
            0% { opacity:0; transform:translateY(20px) scale(0.9); } 
            10% { opacity:1; transform:translateY(0) scale(1); } 
            90% { opacity:1; transform:translateY(0) scale(1); } 
            100% { opacity:0; transform:translateY(-20px) scale(0.9); } 
        }

        /* FEED CHAT */
        .feed-container {
            flex: 1; overflow-y: auto; padding: 15px; z-index: 10;
            display: flex; flex-direction: column; gap: 15px;
            mask-image: linear-gradient(to bottom, transparent, black 2%, black 98%, transparent);
            scrollbar-width: none; padding-bottom: 160px;
            -webkit-overflow-scrolling: touch;
        }
        
        /* CARD FIX: ANTI GEPENG */
        .wish-card {
            background: var(--glass-bg); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 18px;
            padding: 18px; /* Padding lebih besar */
            animation: popIn 0.3s ease-out;
            max-width: 600px; margin: 0 auto; width: 100%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            
            /* Penting: Layout Block biar isinya dorong tinggi kartu */
            display: block; 
            position: relative; overflow: visible;
        }
        @keyframes popIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }

        /* HEADER KARTU */
        .card-top {
            display: flex; align-items: center; gap: 12px;
            width: 100%; border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px; margin-bottom: 10px;
        }
        
        .avatar {
            width: 45px; height: 45px; border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #B8860B);
            color: #000; font-weight: 800; font-family: 'Cinzel';
            display: flex; justify-content: center; align-items: center;
            font-size: 1.3rem; border: 2px solid rgba(255,255,255,0.5);
            flex-shrink: 0; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .user-info { flex: 1; }
        .top-row { display: flex; justify-content: space-between; align-items: center; }

        .sender-name { color: var(--gold); font-weight: 700; font-family: 'Cinzel'; font-size: 1.1rem; text-shadow: 0 0 5px rgba(255, 215, 0, 0.3); }
        .verified { color: #00f3ff; margin-left: 5px; text-shadow: 0 0 5px cyan; }
        
        /* JAM DI POJOK KANAN */
        .timestamp { 
            font-size: 0.75rem; color: rgba(255,255,255,0.7); 
            font-family: monospace; letter-spacing: 1px;
        }

        /* BODY PESAN */
        .card-body {
            font-size: 1.1rem; color: #ffffff; line-height: 1.6; font-weight: 400;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
            margin-left: 57px; /* Indentasi rapi */
            word-wrap: break-word;
            padding-bottom: 5px;
        }

        /* ACTIONS */
        .card-actions {
            display: flex; gap: 20px; font-size: 0.9rem; color: #ccc; 
            margin-top: 5px; margin-left: 57px;
        }
        .action-btn { cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .action-btn:hover { color: white; transform: scale(1.05); }
        .liked { color: #ff4444; font-weight: bold; }

        /* REPLY LIST */
        .reply-container {
            background: rgba(0,0,0,0.4); border-radius: 8px; padding: 12px;
            display: none; border-left: 3px solid var(--gold); margin-left: 57px; margin-top: 12px;
        }
        .reply-item { font-size: 0.95rem; color: #eee; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        
        /* INPUT REPLY */
        .reply-input-box { display: none; gap: 10px; margin-top: 12px; margin-left: 57px; }
        .reply-input-box.show { display: flex; }
        .reply-in { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px; border-radius: 8px; }
        .reply-btn { background: var(--gold); border: none; padding: 0 15px; font-weight: bold; border-radius: 8px; cursor: pointer; }

        /* ADMIN STYLE */
        .wish-card.admin {
            border: 2px solid var(--gold);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(0,0,0,0.9));
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.25);
        }

        /* BOTTOM PANEL */
        .bottom-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 50;
            background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(15px);
            padding: 10px 20px 20px; border-top: 1px solid rgba(255,215,0,0.2);
            display: flex; flex-direction: column; align-items: center;
        }
        .reaction-bar { display: flex; gap: 20px; margin-bottom: 10px; }
        .react-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; width: 45px; height: 45px; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .react-btn:active { transform: scale(0.9); background: var(--gold); }

        .input-group { display: flex; gap: 10px; width: 100%; max-width: 650px; }
        #name-input { width: 30%; background: rgba(30, 30, 40, 0.8); border: 1px solid var(--gold); color: var(--gold); font-weight: 700; border-radius: 12px; padding: 12px; text-align: center; }
        #msg-input { flex: 1; background: rgba(30, 30, 40, 0.8); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 12px; padding: 12px; }
        #send-btn { background: linear-gradient(135deg, var(--gold), #ff8c00); border: none; border-radius: 12px; width: 55px; font-size: 1.4rem; cursor: pointer; color: #000; }

        /* OVERLAY */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: 0.8s; }
        .btn-start { padding: 20px 50px; border: 2px solid var(--gold); color: var(--gold); font-family: 'Cinzel'; font-size: 1.5rem; font-weight: bold; background: rgba(255,215,0,0.05); border-radius: 50px; animation: btnPulse 1.5s infinite; }
        @keyframes btnPulse { 0% { box-shadow: 0 0 0 0 rgba(255,215,0,0.5); } 70% { box-shadow: 0 0 0 20px rgba(255,215,0,0); } }
        .shake { animation: shakeAnim 0.3s; }
        @keyframes shakeAnim { 0% { transform: translateX(0); } 25% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="btn-start">MASUK PARTY 2026</div>
        <p style="color:#aaa; margin-top:20px; font-size:0.8rem;">Tap untuk musik & kembang api!</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="header-container" id="main-header">
        <div class="live-indicator"><div class="dot"></div> LIVE NOW | <span id="clock-display">00:00:00</span></div>
        <div class="year">2026</div>
        <div class="slider-wrapper" id="slider-container"></div>
    </div>

    <div class="feed-container" id="feed">
        <div style="text-align:center; color:#888; margin-top:80px;">
            <div style="font-size: 3rem; margin-bottom: 10px;">🎆</div>
            Menunggu tamu sultan...<br>Jadilah yang pertama!
        </div>
    </div>

    <div class="bottom-panel">
        <div class="reaction-bar">
            <button class="react-btn" onclick="quickReact('🔥')">🔥</button>
            <button class="react-btn" onclick="quickReact('❤️')">❤️</button>
            <button class="react-btn" onclick="quickReact('🎉')">🎉</button>
            <button class="react-btn" onclick="quickReact('🚀')">🚀</button>
            <button class="react-btn" onclick="quickReact('👑')">👑</button>
        </div>
        <div class="input-wrapper input-group">
            <input type="text" id="name-input" placeholder="Nama" maxlength="12">
            <input type="text" id="msg-input" placeholder="Tulis harapan...">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script>
        // --- REALTIME CLOCK ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-display').innerText = now.toLocaleTimeString('id-ID');
        }
        setInterval(updateClock, 1000); updateClock();

        // --- SLIDER DATA ---
        const roastData = [
            { title: "RONI SETIAWAN", text: "Selamat Tahun Baru 2026! Semoga tahun ini rezekinya 'gacor' dan dijauhkan dari teman yang suka 'pinjam dulu seratus'." },
            { title: "GEN 98+", text: "Udah 2026 woy! Jangan cuma kondangan mulu, kapan ngundangnya? 🤣" },
            { title: "RESOLUSI 2026", text: "Jadi kaya raya tanpa harus ikut pesugihan. Rebahan, tapi saldo nambah terus." },
            { title: "PANTUN", text: "Makan ketan di pinggir jalan, mantan lewat tolong abaikan. Tahun depan ayo nikahan! Wkwk." },
            { title: "REALITA KERJA", text: "Semoga tahun ini kerjanya remote, gajinya dollar, tapi pengeluaran tetap rupiah warteg." },
            { title: "TIM JOMBLO", text: "Resolusi 2026, Berhenti jadi 'penjaga jodoh orang'. Saatnya jadi pemeran utama!" },
            { title: "KEUANGAN", text: "Ya Allah, semoga tahun ini dompet hamba setebal harapan orang tua hamba kepada hamba." },
            { title: "AAMIIN", text: "Semoga semua yang baca ini sehat selalu, sukses karirnya, dan bahagia terus. Gas 2026!" }
        ];

        let sliderIndex = 0;
        const sliderContainer = document.getElementById('slider-container');
        function showNextCard() {
            const item = roastData[sliderIndex];
            sliderContainer.innerHTML = '';
            const card = document.createElement('div');
            card.className = 'roast-card';
            card.innerHTML = `<div class="roast-title">✨ ${item.title} ✨</div><div class="roast-content">"${item.text}"</div>`;
            sliderContainer.appendChild(card);
            sliderIndex = (sliderIndex + 1) % roastData.length;
        }
        showNextCard(); setInterval(showNextCard, 5000);

        // --- VISUAL ENGINE (FIREWORKS) ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const header = document.getElementById('main-header');
        let audioCtx;
        let mouse = { x: undefined, y: undefined };

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });

        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            if(type === 'boom') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else { 
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        // Particle System
        class Particle {
            constructor(x, y, color, velocity) {
                this.x = x; this.y = y; this.color = color;
                this.velocity = velocity; this.alpha = 1; this.life = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.velocity.x *= 0.96; this.velocity.y *= 0.96; 
                this.velocity.y += 0.05; // gravity
                this.x += this.velocity.x; this.y += this.velocity.y; 
                this.alpha -= this.life;
            }
            draw() {
                ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            }
        }

        class Firework {
            constructor(x, targetY, color) {
                this.x = x; this.y = canvas.height; this.targetY = targetY; this.color = color;
                this.velocity = { x: (Math.random() - 0.5) * 2, y: -Math.random() * 3 - 10 };
                this.exploded = false;
            }
            update() {
                this.velocity.y *= 0.98; this.y += this.velocity.y; this.x += this.velocity.x;
                if (this.velocity.y >= -1 || this.y <= this.targetY) { this.exploded = true; this.explode(); }
            }
            draw() {
                ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2); ctx.fill();
            }
            explode() {
                playSound('boom');
                for (let i = 0; i < 50; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 1;
                    const velocity = { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed };
                    particles.push(new Particle(this.x, this.y, this.color, velocity));
                }
            }
        }

        let fireworks = []; let particles = []; let stars = [];
        for(let i=0; i<100; i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, size:Math.random()*2});

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => { ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill(); });
            
            if(Math.random() < 0.02) {
                const x = Math.random() * canvas.width;
                const color = `hsl(${Math.random() * 360}, 60%, 50%)`;
                fireworks.push(new Firework(x, canvas.height/2, color));
            }

            fireworks.forEach((fw, i) => { fw.update(); fw.draw(); if(fw.exploded) fireworks.splice(i, 1); });
            particles.forEach((p, i) => { p.update(); p.draw(); if(p.life <= 0) particles.splice(i, 1); });
            requestAnimationFrame(animate);
        }

        overlay.addEventListener('click', () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            overlay.style.opacity = 0; setTimeout(()=>overlay.remove(), 800); animate();
        });

        // --- FIRESTORE LOGIC ---
        window.addEventListener('firebase-ready', () => {
            const feedDiv = document.getElementById('feed');
            const nameIn = document.getElementById('name-input');
            const msgIn = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            
            const colRef = window.collection(window.db, 'gala_2026_final');
            const q = window.query(colRef, window.orderBy('timestamp', 'asc'));

            if(localStorage.getItem('chatName')) nameIn.value = localStorage.getItem('chatName');

            window.onSnapshot(q, (snapshot) => {
                if(feedDiv.innerText.includes("Menunggu")) feedDiv.innerHTML = "";

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        const key = change.doc.id;

                        // ADMIN CHECK
                        let nameDisplay = escapeHtml(data.name);
                        let specialClass = '';
                        let verifiedIcon = '';
                        if(nameDisplay === "RONI SETIAWAN") {
                            verifiedIcon = ' <span class="verified">💎</span>';
                            specialClass = 'admin';
                        }

                        // Avatar Initials
                        const initial = data.name.charAt(0).toUpperCase();

                        const div = document.createElement('div');
                        div.className = `wish-card ${specialClass}`;
                        div.id = `card-${key}`;
                        
                        // STRUCTURE BARU (BIAR GAK GEPENG)
                        div.innerHTML = `
                            <div class="card-top">
                                <div class="avatar">${initial}</div>
                                <div class="user-info">
                                    <div class="top-row">
                                        <span class="sender-name">${nameDisplay}${verifiedIcon}</span>
                                        <span class="timestamp">${new Date(data.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="card-body">${escapeHtml(data.message)}</div>
                            
                            <div class="reply-container" id="reply-list-${key}"></div>
                            
                            <div class="card-actions">
                                <div class="action-btn" onclick="likePost('${key}')">
                                    <span id="heart-${key}">♡</span> <span id="likes-${key}">${data.likes||0}</span>
                                </div>
                                <div class="action-btn" onclick="toggleReply('${key}')">↩ Balas</div>
                            </div>
                            
                            <div class="reply-input-box" id="reply-box-${key}">
                                <input type="text" class="reply-in" id="reply-input-${key}" placeholder="Tulis balasan...">
                                <button class="reply-btn" onclick="sendReply('${key}')">></button>
                            </div>
                        `;
                        feedDiv.appendChild(div);
                        
                        // Load Replies
                        if(data.replies && data.replies.length > 0) {
                            const cont = document.getElementById(`reply-list-${key}`);
                            cont.style.display = 'block';
                            data.replies.forEach(r => renderReply(cont, r));
                        }

                        feedDiv.scrollTop = feedDiv.scrollHeight;
                        fireworks.push(new Firework(Math.random()*canvas.width, canvas.height/2, '#FFD700'));
                        playSound('pop');
                    }
                    
                    if (change.type === "modified") {
                        const data = change.doc.data();
                        const key = change.doc.id;
                        document.getElementById(`likes-${key}`).innerText = data.likes || 0;
                        
                        const cont = document.getElementById(`reply-list-${key}`);
                        if(cont) {
                            cont.innerHTML = ""; 
                            if(data.replies && data.replies.length > 0) {
                                cont.style.display = 'block';
                                data.replies.forEach(r => renderReply(cont, r)); 
                            }
                        }
                    }
                });
            });

            // SEND BUTTON
            sendBtn.onclick = async () => {
                const name = nameIn.value.trim().toUpperCase() || "ANONIM";
                const msg = msgIn.value.trim();
                if(!msg) return;
                localStorage.setItem('chatName', name);

                try {
                    await window.addDoc(colRef, { name: name, message: msg, likes: 0, replies: [], timestamp: Date.now() });
                    msgIn.value = "";
                    header.classList.add('shake'); setTimeout(()=>header.classList.remove('shake'), 400);
                } catch (e) { alert("Gagal kirim: " + e.message); }
            };

            // QUICK REACT
            window.quickReact = async (emoji) => {
                const name = nameIn.value.trim().toUpperCase() || "ANONIM";
                try {
                    await window.addDoc(colRef, { name: name, message: emoji, likes: 0, replies: [], timestamp: Date.now() });
                } catch (e) { console.log(e); }
            };
        });

        // GLOBAL ACTIONS
        window.likePost = (key) => {
            const heart = document.getElementById(`heart-${key}`);
            if(heart.innerText === '♡') {
                heart.innerText = '♥'; heart.classList.add('liked');
                const docRef = window.doc(window.db, 'gala_2026_final', key);
                window.updateDoc(docRef, { likes: window.increment(1) });
            }
        };

        window.toggleReply = (key) => { document.getElementById(`reply-box-${key}`).classList.toggle('show'); };

        window.sendReply = (key) => {
            const input = document.getElementById(`reply-input-${key}`);
            const text = input.value.trim();
            const name = document.getElementById('name-input').value.trim().toUpperCase() || "ANONIM";
            if(!text) return;
            const docRef = window.doc(window.db, 'gala_2026_final', key);
            window.updateDoc(docRef, { replies: window.arrayUnion({ name, text }) });
            input.value = ""; document.getElementById(`reply-box-${key}`).classList.remove('show');
        };

        function renderReply(container, data) {
            const div = document.createElement('div');
            div.className = 'reply-item';
            div.innerHTML = `<b style="color:var(--gold)">${escapeHtml(data.name)}:</b> ${escapeHtml(data.text)}`;
            container.appendChild(div);
        }
        function escapeHtml(text) { return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
    </script>
</body>
</html>
