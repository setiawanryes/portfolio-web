<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RONI'S GALA 2026 - CYBER PARTY</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, arrayUnion, increment, query, orderBy 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIG FIRESTORE (AMAN)
        const firebaseConfig = {
            apiKey: "AIzaSyBGS2_U6M-lC0YozJd0FCHpncyNLE1mE2g",
            authDomain: "portfolio-setiawanryes.firebaseapp.com",
            projectId: "portfolio-setiawanryes",
            storageBucket: "portfolio-setiawanryes.firebasestorage.app",
            messagingSenderId: "171755400027",
            appId: "1:171755400027:web:6bbbbbda56613af0b4087e",
            measurementId: "G-4R3C18RXW0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db; 
        window.collection = collection; 
        window.addDoc = addDoc; 
        window.onSnapshot = onSnapshot;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.arrayUnion = arrayUnion;
        window.increment = increment;
        window.query = query;
        window.orderBy = orderBy;
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@300;400;600;700&display=swap');
        :root {
            --neon-purple: #bc13fe;
            --neon-blue: #13e2fe;
            --gold: #ffd700;
            --dark-bg: #0a0a12;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--dark-bg);
            /* Background Nebula Dinamis */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(188, 19, 254, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(19, 226, 254, 0.2) 0%, transparent 50%);
            color: white; height: 100vh; overflow: hidden; font-family: 'Poppins', sans-serif;
            display: flex; flex-direction: column;
        }
        /* Efek awan bergerak pelan */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://assets.codepen.io/13471/nebula.jpg') no-repeat center center fixed;
            background-size: cover; opacity: 0.15; mix-blend-mode: screen;
            animation: nebulaMove 60s linear infinite; z-index: -1;
        }
        @keyframes nebulaMove { 0% { background-position: 0% 0%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 0%; } }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; mix-blend-mode: screen; }

        /* HEADER - Lebih Bold */
        .header-container {
            z-index: 10; padding: 20px 15px 10px 15px; text-align: center; flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(10,10,18,0.9), transparent);
            border-bottom: 1px solid rgba(19, 226, 254, 0.1);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .title {
            font-family: 'Cinzel', serif; color: var(--neon-blue); font-size: 0.9rem; letter-spacing: 4px; font-weight: 900;
            text-shadow: 0 0 10px rgba(19, 226, 254, 0.8); animation: neonPulse 2s infinite alternate;
        }
        .year {
            font-size: 3rem; font-weight: 900; line-height: 1; margin: 5px 0 15px 0;
            background: linear-gradient(45deg, var(--neon-blue), var(--gold), var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.5));
        }

        /* SLIDER CARD - Cyberpunk Style */
        .slider-wrapper {
            width: 100%; max-width: 550px; height: 90px; margin: 0 auto;
            position: relative; overflow: hidden;
            perspective: 1000px; /* Untuk efek 3D */
        }
        .roast-card {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            /* Glassmorphism + Neon Border */
            background: rgba(20, 20, 35, 0.4); backdrop-filter: blur(10px);
            border: 2px solid transparent;
            background-clip: padding-box, border-box;
            background-origin: padding-box, border-box;
            background-image: linear-gradient(rgba(20,20,35,0.6), rgba(20,20,35,0.6)), linear-gradient(45deg, var(--neon-purple), var(--neon-blue));
            border-radius: 15px; padding: 5px 20px;
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.15) inset;
            animation: cyberSlide 5s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .roast-title {
            color: var(--gold); font-family: 'Cinzel', serif; font-size: 0.9rem; font-weight: 900;
            margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase;
            text-shadow: 0 0 5px var(--gold);
        }
        .roast-content {
            color: #fff; font-size: 0.85rem; font-style: italic; line-height: 1.3; text-align: center;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        @keyframes cyberSlide {
            0% { opacity: 0; transform: translateY(40px) rotateX(-20deg); }
            10% { opacity: 1; transform: translateY(0) rotateX(0deg); }
            90% { opacity: 1; transform: translateY(0) rotateX(0deg); }
            100% { opacity: 0; transform: translateY(-40px) rotateX(20deg); }
        }

        /* FEED CHAT - Ultra Glass */
        .feed-container {
            flex: 1; overflow-y: auto; padding: 15px 15px; z-index: 10;
            display: flex; flex-direction: column; gap: 15px;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            scrollbar-width: none; padding-bottom: 90px; 
        }
        .feed-container::-webkit-scrollbar { display: none; }

        .wish-card {
            /* Transparan abis tapi kebaca */
            background: rgba(30, 30, 50, 0.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 18px; padding: 15px; 
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 600px; margin: 0 auto; width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .wish-card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 40px 0 rgba(19, 226, 254, 0.2);
            border-color: var(--neon-blue);
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .sender-name { color: var(--neon-blue); font-weight: 800; font-size: 1rem; font-family: 'Cinzel'; text-shadow: 0 0 5px rgba(19, 226, 254, 0.5); }
        .timestamp { font-size: 0.7rem; opacity: 0.6; font-weight: 300; }
        .card-body { font-size: 1rem; color: #fff; line-height: 1.5; text-shadow: 0 1px 2px rgba(0,0,0,0.5); font-weight: 400; }
        
        .card-actions { display: flex; gap: 20px; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.85rem; color: #ccc; }
        .action-btn { cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .action-btn:hover { color: var(--neon-blue); }
        .liked { color: #ff4444; font-weight: bold; filter: drop-shadow(0 0 5px #ff4444); }

        /* Reply Area */
        .reply-container { margin-top: 10px; padding-left: 10px; border-left: 3px solid var(--neon-purple); display: none; background: rgba(0,0,0,0.2); border-radius: 0 10px 10px 0; padding: 8px; }
        .reply-item { font-size: 0.85rem; color: #ddd; margin-top: 5px; }
        .reply-input-box { display: none; margin-top: 10px; gap: 8px; }
        .reply-input-box.show { display: flex; animation: slideDown 0.3s ease; }
        .reply-in { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--neon-purple); color: white; padding: 8px 12px; border-radius: 8px; }
        .reply-btn { background: var(--neon-purple); color: white; border: none; padding: 0 15px; font-weight: bold; cursor: pointer; border-radius: 8px; box-shadow: 0 0 10px rgba(188, 19, 254, 0.3); }

        /* INPUT - Control Panel Style */
        .input-wrapper {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(10, 10, 18, 0.95); backdrop-filter: blur(20px);
            padding: 15px 20px; border-top: 2px solid var(--neon-blue);
            z-index: 20; display: flex; justify-content: center;
            box-shadow: 0 -5px 20px rgba(19, 226, 254, 0.15);
        }
        .input-group { display: flex; gap: 10px; width: 100%; max-width: 650px; }
        input { transition: 0.3s; }
        input:focus { box-shadow: 0 0 15px var(--neon-blue); border-color: var(--neon-blue) !important; }
        #name-input { width: 28%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,215,0,0.3); color: var(--gold); font-weight: 700; border-radius: 12px; padding: 12px; text-align: center; letter-spacing: 1px; }
        #msg-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 12px; padding: 12px; }
        #send-btn { 
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); 
            border: none; border-radius: 12px; width: 55px; cursor: pointer; font-size: 1.4rem; color: white;
            box-shadow: 0 0 20px rgba(19, 226, 254, 0.4); transition: 0.3s;
        }
        #send-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(188, 19, 254, 0.6); }
        #send-btn:active { transform: scale(0.95); }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a12; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; transition: 0.8s cubic-bezier(0.7, 0, 0.3, 1);
        }
        .btn-start {
            padding: 20px 40px; border: 3px solid var(--neon-blue); color: var(--neon-blue); font-family: 'Cinzel'; font-weight: 900;
            font-size: 1.5rem; border-radius: 50px; animation: pulse 1.5s infinite; letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-blue); box-shadow: 0 0 20px rgba(19, 226, 254, 0.2) inset;
            background: rgba(19, 226, 254, 0.05);
        }

        /* ANIMATIONS */
        @keyframes popIn { from { transform: scale(0.8) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(19, 226, 254, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(19, 226, 254, 0); } 100% { box-shadow: 0 0 0 0 rgba(19, 226, 254, 0); } }
        @keyframes neonPulse { from { text-shadow: 0 0 5px var(--neon-blue); opacity: 0.8; } to { text-shadow: 0 0 20px var(--neon-blue), 0 0 30px var(--neon-purple); opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shakeAnim 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeAnim { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="btn-start">ENTER CYBER PARTY</div>
        <p style="color:var(--neon-purple); margin-top:20px; font-size:0.9rem; letter-spacing: 1px;">Tap anywhere to ignite</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="header-container" id="main-header">
        <div class="title">LIVE CYBER-WISHES</div>
        <div class="year">2026</div>
        <div class="slider-wrapper" id="slider-container"></div>
    </div>

    <div class="feed-container" id="feed">
        <div style="text-align:center; color:rgba(255,255,255,0.5); margin-top:80px; font-style: italic;">
            <div style="font-size: 3rem; margin-bottom: 10px; filter: drop-shadow(0 0 10px var(--neon-purple));">👾</div>
            Belum ada sinyal kehidupan...<br>Jadilah netizen pertama di 2026!
        </div>
    </div>

    <div class="input-wrapper">
        <div class="input-group">
            <input type="text" id="name-input" placeholder="Codename" maxlength="10">
            <input type="text" id="msg-input" placeholder="Transmisikan harapanmu...">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script>
        // --- SLIDER CARD (Kece Version) ---
        const roastData = [
            { title: "RONI SETIAWAN", text: "Selamat Tahun Baru 2026! Semoga tahun ini rezekinya 'gacor' dan dijauhkan dari teman yang suka 'pinjam dulu seratus'." },
            { title: "GEN 98+", text: "Udah 2026 woy! Jangan cuma kondangan mulu, kapan ngundangnya? 🤣" },
            { title: "RESOLUSI 2026", text: "Jadi kaya raya tanpa harus ikut pesugihan. Rebahan, tapi saldo nambah terus. Aminin yang kenceng!" },
            { title: "PANTUN", text: "Makan ketan di pinggir jalan, mantan lewat tolong abaikan. Tahun depan ayo nikahan, biar gak jadi beban pikiran! Wkwk." },
            { title: "REALITA KERJA", text: "Semoga tahun ini kerjanya remote, gajinya dollar, tapi pengeluaran tetap rupiah warteg." },
            { title: "TIM JOMBLO", text: "Resolusi 2026, Berhenti jadi 'penjaga jodoh orang'. Saatnya jadi pemeran utama!" },
            { title: "KEUANGAN", text: "Ya Allah, semoga tahun ini dompet hamba setebal harapan orang tua hamba kepada hamba." },
            { title: "HOPE", text: "Diet wacana sudah berlalu, tahun ini body goals harus jadi nomor satu." },
            { title: "GEN Z", text: "Mental aman? Semoga tahun ini ga dikit-dikit 'Burnout' padahal baru kerja 5 menit. Semangat!" },
            { title: "SANDWICH GEN", text: "Semoga punggung kita sekuat baja menahan beban keluarga, bukan encok mikirin cicilan Paylater." },
            { title: "TIPS SUKSES", text: "Kerja keras itu penting, tapi kerja cerdas (baca: cari orang dalem) lebih penting. Canda orang dalem! ✌️" },
            { title: "AAMIIN", text: "Semoga semua yang baca ini sehat selalu, sukses karirnya, dan bahagia terus. Gas 2026!" }
        ];

        let sliderIndex = 0;
        const sliderContainer = document.getElementById('slider-container');
        function showNextCard() {
            const item = roastData[sliderIndex];
            sliderContainer.innerHTML = '';
            const card = document.createElement('div');
            card.className = 'roast-card';
            card.innerHTML = `<div class="roast-title">✨ ${item.title} ✨</div><div class="roast-content">"${item.text}"</div>`;
            sliderContainer.appendChild(card);
            sliderIndex = (sliderIndex + 1) % roastData.length;
        }
        showNextCard(); setInterval(showNextCard, 5000);

        // --- VISUAL (CANVAS PARTICLES - Lebih Neon) ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const header = document.getElementById('main-header');
        let audioCtx;
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            if(type === 'boom') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                osc.type = 'square'; // Suara lebih retro
            } else { 
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                osc.type = 'sine';
            }
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (type==='boom'?0.6:0.15));
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const a = Math.random() * 6.28; const s = Math.random() * 8 + 3;
                this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
                this.life = 1; this.decay = Math.random() * 0.02 + 0.015; this.gravity = 0.1;
                this.lineWidth = Math.random() * 3 + 1;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += this.gravity; this.life -= this.decay; }
            draw() { 
                ctx.globalAlpha = this.life; 
                ctx.strokeStyle = this.color; 
                ctx.lineWidth = this.lineWidth;
                ctx.shadowBlur = 15; ctx.shadowColor = this.color; // Neon effect
                ctx.beginPath(); 
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.vx, this.y - this.vy); // Trail effect
                ctx.stroke();
            }
        }
        let particles = [];
        let stars = [];
        for(let i=0; i<200; i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2.5, a:Math.random()});
        function createExplosion(x, y, color) {
            playSound('boom');
            // Warna neon random
            const colors = ['#bc13fe', '#13e2fe', '#ffd700', '#ff4444'];
            const c = color || colors[Math.floor(Math.random() * colors.length)];
            for(let i=0; i<50; i++) particles.push(new Particle(x, y, c));
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            stars.forEach(s => { 
                ctx.fillStyle = `rgba(255,255,255,${s.a})`; 
                ctx.shadowBlur = s.s*2; ctx.shadowColor = 'white';
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.28); ctx.fill(); 
                if(Math.random()>0.95) s.a = Math.random(); // Kerlip
            });
            particles.forEach((p,i) => { p.update(); p.draw(); if(p.life<=0) particles.splice(i,1); });
            if(Math.random() < 0.015) createExplosion(Math.random()*canvas.width, Math.random()*canvas.height*0.6);
            requestAnimationFrame(animate);
        }
        overlay.addEventListener('click', () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            overlay.style.opacity = 0; setTimeout(()=>overlay.remove(), 800); animate();
        });

        // --- FIRESTORE LOGIC ---
        window.addEventListener('firebase-ready', () => {
            const feedDiv = document.getElementById('feed');
            const nameIn = document.getElementById('name-input');
            const msgIn = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            
            const colRef = window.collection(window.db, 'gala_party_2026');
            const q = window.query(colRef, window.orderBy('timestamp', 'asc'));

            // LISTEN DATA
            window.onSnapshot(q, (snapshot) => {
                if(feedDiv.innerText.includes("Belum ada")) feedDiv.innerHTML = "";

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        const key = change.doc.id;

                        const div = document.createElement('div');
                        div.className = 'wish-card';
                        div.id = `card-${key}`;
                        div.innerHTML = `
                            <div class="card-header">
                                <span class="sender-name">${escapeHtml(data.name)}</span>
                                <span class="timestamp">${new Date(data.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                            </div>
                            <div class="card-body">${escapeHtml(data.message)}</div>
                            <div class="reply-container" id="reply-list-${key}"></div>
                            <div class="card-actions">
                                <div class="action-btn" onclick="likePost('${key}')">
                                    <span id="heart-${key}" style="font-size:1.2rem">♡</span> <span id="likes-${key}">${data.likes||0}</span>
                                </div>
                                <div class="action-btn" onclick="toggleReply('${key}')" style="color:var(--neon-blue)">↩ Balas</div>
                            </div>
                            <div class="reply-input-box" id="reply-box-${key}">
                                <input type="text" class="reply-in" id="reply-input-${key}" placeholder="Balas...">
                                <button class="reply-btn" onclick="sendReply('${key}')">></button>
                            </div>
                        `;
                        feedDiv.appendChild(div);
                        feedDiv.scrollTop = feedDiv.scrollHeight;

                        if(data.replies) data.replies.forEach(r => renderReply(key, r));
                        createExplosion(Math.random()*canvas.width, Math.random()*canvas.height/2);
                        playSound('pop');
                    }
                    if (change.type === "modified") {
                        const data = change.doc.data();
                        const key = change.doc.id;
                        document.getElementById(`likes-${key}`).innerText = data.likes || 0;
                        const cont = document.getElementById(`reply-list-${key}`);
                        cont.innerHTML = "";
                        if(data.replies) data.replies.forEach(r => renderReply(key, r));
                        cont.style.display = data.replies && data.replies.length > 0 ? 'block' : 'none';
                    }
                });
            });

            // KIRIM
            sendBtn.onclick = async () => {
                const name = nameIn.value.trim().toUpperCase() || "ANONIM";
                const msg = msgIn.value.trim();
                if(!msg) return;

                try {
                    await window.addDoc(colRef, {
                        name: name, message: msg, likes: 0, replies: [], timestamp: Date.now()
                    });
                    msgIn.value = "";
                    header.classList.add('shake'); setTimeout(()=>header.classList.remove('shake'), 400);
                    createExplosion(window.innerWidth/2, window.innerHeight - 100, '#13e2fe');
                } catch (e) {
                    alert("Gagal kirim: " + e.message);
                }
            };
        });

        // ACTIONS
        window.likePost = (key) => {
            const heart = document.getElementById(`heart-${key}`);
            if(heart.innerText === '♡') {
                heart.innerText = '♥'; heart.classList.add('liked');
                const docRef = window.doc(window.db, 'gala_party_2026', key);
                window.updateDoc(docRef, { likes: window.increment(1) });
                createExplosion(window.innerWidth/2, window.innerHeight/2, '#ff4444');
            }
        };

        window.toggleReply = (key) => {
            document.getElementById(`reply-box-${key}`).classList.toggle('show');
        };

        window.sendReply = (key) => {
            const input = document.getElementById(`reply-input-${key}`);
            const text = input.value.trim();
            const name = document.getElementById('name-input').value.trim().toUpperCase() || "ANONIM";
            if(!text) return;

            const docRef = window.doc(window.db, 'gala_party_2026', key);
            window.updateDoc(docRef, { replies: window.arrayUnion({ name, text }) });
            input.value = "";
            document.getElementById(`reply-box-${key}`).classList.remove('show');
        };

        function renderReply(key, data) {
            const cont = document.getElementById(`reply-list-${key}`);
            cont.style.display = 'block';
            const div = document.createElement('div');
            div.className = 'reply-item';
            div.innerHTML = `<b style="color:var(--neon-purple)">${escapeHtml(data.name)}:</b> ${escapeHtml(data.text)}`;
            cont.appendChild(div);
        }
        function escapeHtml(text) { return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
    </script>
</body>
</html>
