<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RONI'S ROYAL GALA 2026</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, arrayUnion, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGS2_U6M-lC0YozJd0FCHpncyNLE1mE2g",
            authDomain: "portfolio-setiawanryes.firebaseapp.com",
            projectId: "portfolio-setiawanryes",
            storageBucket: "portfolio-setiawanryes.firebasestorage.app",
            messagingSenderId: "171755400027",
            appId: "1:171755400027:web:6bbbbbda56613af0b4087e",
            measurementId: "G-4R3C18RXW0"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.collection = collection; window.addDoc = addDoc; window.onSnapshot = onSnapshot;
        window.doc = doc; window.updateDoc = updateDoc; window.arrayUnion = arrayUnion;
        window.increment = increment; window.query = query; window.orderBy = orderBy;
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Montserrat:wght@300;400;600&display=swap');
        
        :root {
            --gold: #FFD700;
            --gold-dim: #C5A000;
            --glass-bg: rgba(20, 20, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --admin-glow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            /* Royal Deep Space */
            background: radial-gradient(circle at bottom center, #1b2735 0%, #090a0f 100%);
            color: white; height: 100vh; overflow: hidden; font-family: 'Montserrat', sans-serif;
            display: flex; flex-direction: column;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

        /* HEADER CLASSY */
        .header-container {
            z-index: 10; padding: 15px; text-align: center; flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* JAM ELEGAN */
        .classy-clock {
            font-family: 'Cinzel'; font-size: 0.9rem; color: var(--gold); letter-spacing: 2px;
            margin-bottom: 5px; opacity: 0.9; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            display: inline-block; padding: 5px 15px; border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px; background: rgba(0,0,0,0.3);
        }

        .year {
            font-size: 3rem; font-weight: 800; line-height: 1; margin: 10px 0 15px 0; font-family: 'Cinzel';
            background: linear-gradient(to right, #fff, var(--gold), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shineText 5s linear infinite;
        }
        @keyframes shineText { to { background-position: 200% center; } }

        /* SLIDER CARD (Elegant Slide) */
        .slider-wrapper {
            width: 100%; max-width: 500px; height: 80px; margin: 0 auto; position: relative;
        }
        .roast-card {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            padding: 5px 20px; animation: smoothFade 6s infinite;
        }
        .roast-title { color: var(--gold); font-family: 'Cinzel'; font-size: 0.8rem; font-weight: bold; margin-bottom: 3px; letter-spacing: 1px; }
        .roast-content { color: #ddd; font-size: 0.85rem; font-style: italic; line-height: 1.3; text-align: center; }
        
        @keyframes smoothFade {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        /* FEED CHAT */
        .feed-container {
            flex: 1; overflow-y: auto; padding: 15px; z-index: 10;
            display: flex; flex-direction: column; gap: 15px;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            scrollbar-width: none; padding-bottom: 160px;
            -webkit-overflow-scrolling: touch;
        }
        
        .wish-card {
            background: var(--glass-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 15px; animation: slideUp 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            max-width: 600px; margin: 0 auto; width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative; overflow: hidden;
        }
        @keyframes slideUp { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }

        /* 🔥 ADMIN SULTAN EFFECT 🔥 */
        .wish-card.admin-card {
            border: 1px solid var(--gold);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.05), rgba(0, 0, 0, 0.6));
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
        }
        .wish-card.admin-card::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent);
            transform: skewX(-25deg);
            animation: shineCard 6s infinite;
        }
        @keyframes shineCard { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        /* USER INFO */
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .sender-name { 
            color: var(--gold); font-weight: 700; font-size: 0.95rem; font-family: 'Cinzel'; 
            display: flex; align-items: center; gap: 6px;
        }
        .verified-icon { color: #00c3ff; font-size: 0.9rem; filter: drop-shadow(0 0 5px rgba(0,195,255,0.4)); }
        .timestamp { font-size: 0.7rem; opacity: 0.5; }
        
        .card-body { font-size: 1rem; color: #fff; line-height: 1.5; font-weight: 300; }
        
        .card-actions { 
            display: flex; gap: 20px; margin-top: 12px; padding-top: 8px; 
            border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; color: #aaa; 
        }
        .action-btn { cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .action-btn:hover { color: white; }
        .liked { color: #ff4444; font-weight: bold; }

        /* REPLY SECTION */
        .reply-container { margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; display: none; border-left: 2px solid var(--gold); }
        .reply-item { font-size: 0.85rem; color: #ccc; margin-bottom: 5px; }
        .reply-input-box { display: none; margin-top: 10px; gap: 8px; }
        .reply-input-box.show { display: flex; }
        .reply-in { flex: 1; background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 8px; }
        .reply-btn { background: var(--gold); color: #000; border: none; padding: 0 15px; font-weight: bold; cursor: pointer; border-radius: 8px; }

        /* BOTTOM PANEL */
        .bottom-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 50;
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(to top, #000 80%, transparent);
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }

        /* FLOATING EMOJI (BUBBLES) */
        #floating-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; overflow: hidden; }
        .float-emoji { position: absolute; bottom: -50px; font-size: 2rem; animation: floatUp 4s ease-in forwards; opacity: 0; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(0.5) translateX(0); opacity: 0; } 
            20% { opacity: 1; }
            100% { transform: translateY(-80vh) scale(1.1) translateX(20px); opacity: 0; } 
        }

        /* REACTION BAR */
        .reaction-bar {
            display: flex; gap: 20px; margin-bottom: 10px; padding: 8px 25px;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
            border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            transform: translateY(-5px);
        }
        .react-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3)); }
        .react-btn:hover { transform: scale(1.3); }

        .input-wrapper { width: 100%; padding: 0 20px 20px; display: flex; justify-content: center; }
        .input-group { display: flex; gap: 10px; width: 100%; max-width: 650px; }
        
        #name-input { 
            width: 28%; background: rgba(30, 30, 40, 0.9); border: 1px solid rgba(255,255,255,0.2); 
            color: var(--gold); font-weight: 600; border-radius: 12px; padding: 12px; 
            text-align: center; font-family: 'Cinzel';
        }
        #msg-input { 
            flex: 1; background: rgba(30, 30, 40, 0.9); border: 1px solid rgba(255,255,255,0.2); 
            color: white; border-radius: 12px; padding: 12px; font-family: 'Montserrat';
        }
        input:focus { border-color: var(--gold) !important; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        
        #send-btn { 
            background: linear-gradient(135deg, var(--gold), #b8860b); 
            border: none; border-radius: 12px; width: 55px; cursor: pointer; font-size: 1.4rem; color: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); transition: 0.3s;
        }
        #send-btn:active { transform: scale(0.9); }

        /* OVERLAY */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050508; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; transition: 0.8s ease-in-out;
        }
        .btn-start {
            padding: 18px 50px; border: 1px solid var(--gold); color: var(--gold); font-family: 'Cinzel'; font-weight: 700;
            font-size: 1.2rem; border-radius: 50px; letter-spacing: 3px; background: rgba(255, 215, 0, 0.05); 
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1); animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0% { box-shadow: 0 0 0 0 rgba(255,215,0,0.4); } 70% { box-shadow: 0 0 0 20px rgba(255,215,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); } }
        .shake { animation: shakeAnim 0.3s; }
        @keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
    </style>
</head>
<body>

    <div id="floating-container"></div>
    <div id="overlay">
        <div class="btn-start">ENTER GALA 2026</div>
        <p style="color:rgba(255,255,255,0.4); margin-top:20px; font-size:0.7rem; letter-spacing: 2px;">[ TAP TO START ]</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="header-container" id="main-header">
        <div class="classy-clock" id="holo-clock">00:00:00</div>
        <div class="year">2026</div>
        <div class="slider-wrapper" id="slider-container"></div>
    </div>

    <div class="feed-container" id="feed">
        <div style="text-align:center; color:rgba(255,255,255,0.3); margin-top:80px; font-style: italic;">
            <div style="font-size: 3rem; margin-bottom: 15px; opacity:0.7;">✨</div>
            Menunggu tamu kehormatan...<br>Kirim harapan pertamamu!
        </div>
    </div>

    <div class="bottom-panel">
        <div class="reaction-bar">
            <button class="react-btn" onclick="quickReact('🔥')">🔥</button>
            <button class="react-btn" onclick="quickReact('❤️')">❤️</button>
            <button class="react-btn" onclick="quickReact('🥂')">🥂</button>
            <button class="react-btn" onclick="quickReact('🚀')">🚀</button>
            <button class="react-btn" onclick="quickReact('👑')">👑</button>
        </div>

        <div class="input-wrapper">
            <div class="input-group">
                <input type="text" id="name-input" placeholder="NAMA" maxlength="15">
                <input type="text" id="msg-input" placeholder="Ketik harapan...">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        // --- REALTIME CLOCK ---
        function updateClock() {
            const now = new Date();
            document.getElementById('holo-clock').innerText = now.toLocaleTimeString('en-GB') + " WIB";
        }
        setInterval(updateClock, 1000); updateClock();

        // --- SLIDER DATA ---
        const roastData = [
            { title: "RONI SETIAWAN", text: "Selamat Tahun Baru 2026! Semoga tahun ini rezekinya 'gacor' dan dijauhkan dari teman yang suka 'pinjam dulu seratus'." },
            { title: "GEN 98+", text: "Udah 2026 woy! Jangan cuma kondangan mulu, kapan ngundangnya? 🤣" },
            { title: "RESOLUSI 2026", text: "Jadi kaya raya tanpa harus ikut pesugihan. Rebahan, tapi saldo nambah terus." },
            { title: "PANTUN", text: "Makan ketan di pinggir jalan, mantan lewat tolong abaikan. Tahun depan ayo nikahan! Wkwk." },
            { title: "REALITA KERJA", text: "Semoga tahun ini kerjanya remote, gajinya dollar, tapi pengeluaran tetap rupiah warteg." },
            { title: "TIM JOMBLO", text: "Resolusi 2026, Berhenti jadi 'penjaga jodoh orang'. Saatnya jadi pemeran utama!" },
            { title: "KEUANGAN", text: "Ya Allah, semoga tahun ini dompet hamba setebal harapan orang tua hamba kepada hamba." },
            { title: "AAMIIN", text: "Semoga semua yang baca ini sehat selalu, sukses karirnya, dan bahagia terus. Gas 2026!" }
        ];

        let sliderIndex = 0;
        const sliderContainer = document.getElementById('slider-container');
        function showNextCard() {
            const item = roastData[sliderIndex];
            sliderContainer.innerHTML = '';
            const card = document.createElement('div');
            card.className = 'roast-card';
            card.innerHTML = `<div class="roast-title">✨ ${item.title} ✨</div><div class="roast-content">"${item.text}"</div>`;
            sliderContainer.appendChild(card);
            sliderIndex = (sliderIndex + 1) % roastData.length;
        }
        showNextCard(); setInterval(showNextCard, 5000);

        // --- VISUAL (STARFIELD & SHOOTING STARS) ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const header = document.getElementById('main-header');
        let audioCtx;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            if(type === 'boom') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            } else { 
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        // Star Class
        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2; this.blinkSpeed = Math.random() * 0.05;
                this.alpha = Math.random(); this.direction = Math.random() > 0.5 ? 1 : -1;
            }
            update() {
                this.alpha += this.blinkSpeed * this.direction;
                if(this.alpha >= 1 || this.alpha <= 0) this.direction *= -1;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.alpha); ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, 6.28); ctx.fill();
            }
        }

        // Shooting Star
        let shootingStars = [];
        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width; this.y = 0;
                this.len = Math.random() * 80 + 10; this.speed = Math.random() * 10 + 5;
                this.size = Math.random() * 1 + 0.1; this.active = false;
                this.waitTime = new Date().getTime() + Math.random() * 3000 + 1000;
            }
            update() {
                if (this.active) {
                    this.x -= this.speed; this.y += this.speed;
                    if (this.x < 0 || this.y >= canvas.height) { this.active = false; this.waitTime = new Date().getTime() + Math.random() * 5000; }
                } else {
                    if (this.waitTime < new Date().getTime()) { this.active = true; this.x = Math.random() * canvas.width + 200; this.y = -50; }
                }
            }
            draw() {
                if (this.active) {
                    ctx.globalAlpha = 1; ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                    ctx.lineWidth = this.size; ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + this.len, this.y - this.len); ctx.stroke();
                }
            }
        }

        let stars = []; for(let i=0; i<150; i++) stars.push(new Star());
        for(let i=0; i<3; i++) shootingStars.push(new ShootingStar());
        
        // Particles Explosion
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const a = Math.random() * 6.28; const s = Math.random() * 4 + 1;
                this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
                this.life = 1; this.decay = 0.02;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
            draw() { ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, 6.28); ctx.fill(); }
        }
        let explosionParticles = [];

        function createExplosion(x, y, color) {
            playSound('boom');
            const colors = ['#ffd700', '#ffffff', '#ff4444'];
            const c = color || colors[Math.floor(Math.random() * colors.length)];
            for(let i=0; i<30; i++) explosionParticles.push(new Particle(x, y, c));
        }

        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            stars.forEach(s => { s.update(); s.draw(); });
            shootingStars.forEach(s => { s.update(); s.draw(); });
            explosionParticles.forEach((p,i) => { p.update(); p.draw(); if(p.life<=0) explosionParticles.splice(i,1); });
            if(Math.random() < 0.005) createExplosion(Math.random()*canvas.width, Math.random()*canvas.height*0.5);
            requestAnimationFrame(animate);
        }

        overlay.addEventListener('click', () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            overlay.style.opacity = 0; setTimeout(()=>overlay.remove(), 800); animate();
        });

        // --- FIRESTORE LOGIC ---
        window.addEventListener('firebase-ready', () => {
            const feedDiv = document.getElementById('feed');
            const nameIn = document.getElementById('name-input');
            const msgIn = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            
            const colRef = window.collection(window.db, 'gala_party_2026');
            const q = window.query(colRef, window.orderBy('timestamp', 'asc'));

            if(localStorage.getItem('chatName')) nameIn.value = localStorage.getItem('chatName');

            window.onSnapshot(q, (snapshot) => {
                if(feedDiv.innerText.includes("Menunggu")) feedDiv.innerHTML = "";

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        const key = change.doc.id;

                        // ADMIN CHECK
                        let nameDisplay = escapeHtml(data.name);
                        let specialClass = '';
                        let verifiedIcon = '';
                        
                        if(nameDisplay === "RONI SETIAWAN") {
                            verifiedIcon = '<span class="verified-icon">💎</span>';
                            specialClass = 'admin-card';
                        }

                        const div = document.createElement('div');
                        div.className = `wish-card ${specialClass}`;
                        div.id = `card-${key}`;
                        div.innerHTML = `
                            <div class="card-content" style="width:100%">
                                <div class="card-header">
                                    <span class="sender-name">${nameDisplay} ${verifiedIcon}</span>
                                    <span class="timestamp">${new Date(data.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                                </div>
                                <div class="card-body">${escapeHtml(data.message)}</div>
                                <div class="reply-container" id="reply-list-${key}"></div>
                                <div class="card-actions">
                                    <div class="action-btn" onclick="likePost('${key}')">
                                        <span id="heart-${key}" style="font-size:1.1rem">♡</span> <span id="likes-${key}">${data.likes||0}</span>
                                    </div>
                                    <div class="action-btn" onclick="toggleReply('${key}')" style="color:var(--gold)">↩ Balas</div>
                                </div>
                                <div class="reply-input-box" id="reply-box-${key}">
                                    <input type="text" class="reply-in" id="reply-input-${key}" placeholder="Tulis balasan...">
                                    <button class="reply-btn" onclick="sendReply('${key}')">></button>
                                </div>
                            </div>
                        `;
                        feedDiv.appendChild(div);
                        feedDiv.scrollTop = feedDiv.scrollHeight;

                        if(data.replies) data.replies.forEach(r => renderReply(key, r));
                        createExplosion(Math.random()*canvas.width, Math.random()*canvas.height/2);
                        playSound('pop');
                    }
                    if (change.type === "modified") {
                        const data = change.doc.data();
                        const key = change.doc.id;
                        document.getElementById(`likes-${key}`).innerText = data.likes || 0;
                        const cont = document.getElementById(`reply-list-${key}`);
                        cont.innerHTML = "";
                        if(data.replies) {
                            data.replies.forEach(r => renderReply(key, r));
                            cont.style.display = "block";
                        }
                    }
                });
            });

            // SEND MESSAGE
            sendBtn.onclick = async () => {
                const name = nameIn.value.trim().toUpperCase() || "ANONIM";
                const msg = msgIn.value.trim();
                if(!msg) return;
                localStorage.setItem('chatName', name);

                try {
                    await window.addDoc(colRef, { name: name, message: msg, likes: 0, replies: [], timestamp: Date.now() });
                    msgIn.value = "";
                    header.classList.add('shake'); setTimeout(()=>header.classList.remove('shake'), 400);
                    createExplosion(window.innerWidth/2, window.innerHeight - 100, '#ffd700');
                } catch (e) { alert("Gagal kirim: " + e.message); }
            };

            // QUICK REACT (FLOATING)
            window.quickReact = async (emoji) => {
                // Visual Float
                const container = document.getElementById('floating-container');
                const el = document.createElement('div');
                el.innerText = emoji; el.className = 'float-emoji';
                el.style.left = (Math.random() * 80 + 10) + '%';
                container.appendChild(el);
                setTimeout(() => el.remove(), 4000);

                const name = nameIn.value.trim().toUpperCase() || "ANONIM";
                localStorage.setItem('chatName', name);
                createExplosion(window.innerWidth/2, window.innerHeight/2, '#ffffff');
                
                try {
                    await window.addDoc(colRef, { name: name, message: emoji, likes: 0, replies: [], timestamp: Date.now() });
                } catch (e) { console.log(e); }
            };
        });

        // HELPERS
        window.likePost = (key) => {
            const heart = document.getElementById(`heart-${key}`);
            if(heart.innerText === '♡') {
                heart.innerText = '♥'; heart.classList.add('liked');
                const docRef = window.doc(window.db, 'gala_party_2026', key);
                window.updateDoc(docRef, { likes: window.increment(1) });
                
                // Visual Float Heart
                const container = document.getElementById('floating-container');
                const el = document.createElement('div');
                el.innerText = '❤️'; el.className = 'float-emoji';
                el.style.left = (Math.random() * 80 + 10) + '%';
                container.appendChild(el);
                setTimeout(() => el.remove(), 4000);
            }
        };

        window.toggleReply = (key) => { document.getElementById(`reply-box-${key}`).classList.toggle('show'); };

        window.sendReply = (key) => {
            const input = document.getElementById(`reply-input-${key}`);
            const text = input.value.trim();
            const name = document.getElementById('name-input').value.trim().toUpperCase() || "ANONIM";
            if(!text) return;
            const docRef = window.doc(window.db, 'gala_party_2026', key);
            window.updateDoc(docRef, { replies: window.arrayUnion({ name, text }) });
            input.value = ""; document.getElementById(`reply-box-${key}`).classList.remove('show');
        };

        function renderReply(key, data) {
            const cont = document.getElementById(`reply-list-${key}`);
            cont.style.display = 'block';
            const div = document.createElement('div');
            div.className = 'reply-item';
            div.innerHTML = `<b style="color:var(--gold)">${escapeHtml(data.name)}:</b> ${escapeHtml(data.text)}`;
            cont.appendChild(div);
        }
        function escapeHtml(text) { return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
    </script>
</body>
</html>
