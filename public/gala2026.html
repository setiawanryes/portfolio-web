<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RONI'S GOLDEN GALA 2026</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, arrayUnion, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ✅ CONFIG AMAN (SESUAI REQUEST)
        const firebaseConfig = {
            apiKey: "AIzaSyBGS2_U6M-lC0YozJd0FCHpncyNLE1mE2g",
            authDomain: "portfolio-setiawanryes.firebaseapp.com",
            projectId: "portfolio-setiawanryes",
            storageBucket: "portfolio-setiawanryes.firebasestorage.app",
            messagingSenderId: "171755400027",
            appId: "1:171755400027:web:6bbbbbda56613af0b4087e",
            measurementId: "G-4R3C18RXW0"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.collection = collection; window.addDoc = addDoc; window.onSnapshot = onSnapshot;
        window.doc = doc; window.updateDoc = updateDoc; window.arrayUnion = arrayUnion;
        window.increment = increment; window.query = query; window.orderBy = orderBy;
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;500;700&display=swap');
        
        :root {
            --gold: #FFD700;
            --gold-glow: #FDB931;
            --dark-blue: #0f0c29;
            --purple: #302b63;
            --glass: rgba(20, 20, 35, 0.6);
            --border: rgba(255, 215, 0, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--dark-blue);
            color: white; height: 100vh; overflow: hidden; font-family: 'Outfit', sans-serif;
            display: flex; flex-direction: column;
        }

        /* BACKGROUND AURORA */
        .aurora-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: 
                radial-gradient(circle at 0% 0%, rgba(48, 43, 99, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(36, 36, 62, 0.5) 0%, transparent 50%);
        }
        .aurora-light {
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background: radial-gradient(circle, rgba(255,215,0,0.05), transparent 70%);
            animation: rotateLight 20s linear infinite;
        }
        @keyframes rotateLight { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

        /* HEADER */
        .header-container {
            z-index: 10; padding: 15px; text-align: center; flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(5px);
        }
        
        .year {
            font-size: 3rem; font-weight: 900; line-height: 1; margin: 5px 0 15px 0; font-family: 'Cinzel';
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            animation: pulseText 3s infinite alternate;
        }
        @keyframes pulseText { from { filter: drop-shadow(0 0 10px var(--gold)); } to { filter: drop-shadow(0 0 30px var(--gold)); } }

        /* SLIDER CARD (3D FLIP) */
        .slider-wrapper {
            width: 100%; max-width: 500px; height: 80px; margin: 0 auto; position: relative;
            perspective: 1000px;
        }
        .roast-card {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border);
            border-radius: 16px; padding: 5px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: flipIn 6s infinite; transform-origin: top center;
            backface-visibility: hidden;
        }
        .roast-title {
            color: var(--gold); font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: bold;
            margin-bottom: 3px; letter-spacing: 2px; text-transform: uppercase;
        }
        .roast-content {
            color: #eee; font-size: 0.85rem; font-style: italic; line-height: 1.2; text-align: center;
        }
        @keyframes flipIn {
            0% { opacity: 0; transform: rotateX(-90deg); }
            10% { opacity: 1; transform: rotateX(0deg); }
            90% { opacity: 1; transform: rotateX(0deg); }
            100% { opacity: 0; transform: rotateX(90deg); }
        }

        /* FEED CHAT */
        .feed-container {
            flex: 1; overflow-y: auto; padding: 15px; z-index: 10;
            display: flex; flex-direction: column; gap: 15px;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            scrollbar-width: none; padding-bottom: 150px;
            -webkit-overflow-scrolling: touch;
        }
        
        /* DESIGN KARTU BARU DENGAN AVATAR */
        .wish-card {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: 18px;
            padding: 15px; animation: slideUp 0.4s ease-out;
            max-width: 600px; margin: 0 auto; width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex; gap: 12px; align-items: flex-start;
            transition: transform 0.2s;
        }
        .wish-card:hover { transform: translateY(-2px); border-color: rgba(255,215,0,0.3); }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        /* Style Khusus Admin */
        .wish-card.admin-card {
            border: 1px solid var(--gold);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(0, 0, 0, 0.6));
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        /* Avatar Bulat */
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(45deg, #FF512F, #DD2476);
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: white; font-family: 'Cinzel';
            flex-shrink: 0; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .card-content { flex: 1; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .sender-name { color: var(--gold); font-weight: 700; font-size: 0.95rem; font-family: 'Cinzel'; display: flex; align-items: center; gap: 5px; }
        .verified { color: #00c6ff; font-size: 0.9rem; filter: drop-shadow(0 0 5px rgba(0,198,255,0.5)); }
        
        .timestamp { font-size: 0.65rem; opacity: 0.5; }
        .card-body { font-size: 0.95rem; color: #fff; line-height: 1.4; font-weight: 300; }
        
        .card-actions { display: flex; gap: 20px; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; color: #aaa; }
        .action-btn { cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .action-btn:hover { color: var(--gold); }
        .liked { color: #ff4444; font-weight: bold; }

        /* Reply */
        .reply-container { margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; display: none; border-left: 2px solid var(--gold); }
        .reply-item { font-size: 0.8rem; color: #ccc; margin-bottom: 5px; }
        .reply-input-box { display: none; margin-top: 10px; gap: 8px; }
        .reply-input-box.show { display: flex; }
        .reply-in { flex: 1; background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px; border-radius: 8px; font-size: 0.85rem; }
        .reply-btn { background: var(--gold); color: #000; border: none; padding: 0 12px; font-weight: bold; cursor: pointer; border-radius: 8px; }

        /* BOTTOM PANEL */
        .bottom-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 50;
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(to top, #000 80%, transparent);
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }

        /* REACTION BAR */
        .reaction-bar {
            display: flex; gap: 15px; margin-bottom: 10px; padding: 8px 20px;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
            border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            transform: translateY(10px); opacity: 0; animation: slideUp 0.5s 0.5s forwards;
        }
        @keyframes slideUp { to { transform: translateY(0); opacity: 1; } }
        
        .react-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; transition: transform 0.2s; }
        .react-btn:hover { transform: scale(1.3); }

        .input-wrapper { width: 100%; padding: 10px 20px 20px; display: flex; justify-content: center; }
        .input-group { display: flex; gap: 10px; width: 100%; max-width: 650px; }
        
        #name-input { 
            width: 28%; background: rgba(30, 30, 40, 0.9); border: 1px solid rgba(255,255,255,0.2); 
            color: var(--gold); font-weight: 700; border-radius: 12px; padding: 12px; 
            text-align: center; transition: 0.3s;
        }
        #msg-input { 
            flex: 1; background: rgba(30, 30, 40, 0.9); border: 1px solid rgba(255,255,255,0.2); 
            color: white; border-radius: 12px; padding: 12px; transition: 0.3s;
        }
        input:focus { border-color: var(--gold) !important; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        
        #send-btn { 
            background: linear-gradient(135deg, var(--gold), #b8860b); 
            border: none; border-radius: 12px; width: 55px; cursor: pointer; font-size: 1.4rem; color: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* OVERLAY */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; transition: 0.8s ease-in-out;
        }
        .btn-start {
            padding: 18px 50px; border: 2px solid var(--gold); color: var(--gold); font-family: 'Cinzel'; font-weight: 700;
            font-size: 1.2rem; border-radius: 50px; letter-spacing: 3px; background: transparent; 
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2); animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0% { box-shadow: 0 0 0 0 rgba(255,215,0,0.7); } 70% { box-shadow: 0 0 0 20px rgba(255,215,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); } }
        .shake { animation: shakeAnim 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeAnim { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body>

    <div class="aurora-bg"><div class="aurora-light"></div></div>

    <div id="overlay">
        <div class="btn-start">BUKA PINTU 2026</div>
        <p style="color:rgba(255,255,255,0.5); margin-top:20px; font-size:0.8rem; letter-spacing: 1px;">Ketuk layar untuk merayakan</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="header-container" id="main-header">
        <div class="year">2026</div>
        <div class="slider-wrapper" id="slider-container"></div>
    </div>

    <div class="feed-container" id="feed">
        <div style="text-align:center; color:rgba(255,255,255,0.3); margin-top:80px; font-style: italic;">
            <div style="font-size: 3rem; margin-bottom: 15px; opacity:0.7;">🥂</div>
            Belum ada harapan...<br>Jadilah yang pertama menulis sejarah!
        </div>
    </div>

    <div class="bottom-panel">
        <div class="reaction-bar">
            <button class="react-btn" onclick="quickReact('🔥', 'Menyala abangkuh!')">🔥</button>
            <button class="react-btn" onclick="quickReact('❤️', 'Love sekebon!')">❤️</button>
            <button class="react-btn" onclick="quickReact('🎉', 'Party 2026!')">🎉</button>
            <button class="react-btn" onclick="quickReact('🚀', 'Gaspol 2026!')">🚀</button>
            <button class="react-btn" onclick="quickReact('💸', 'Auto Sultan 2026!')">💸</button>
        </div>

        <div class="input-wrapper">
            <div class="input-group">
                <input type="text" id="name-input" placeholder="Nama" maxlength="12">
                <input type="text" id="msg-input" placeholder="Tulis harapan...">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        // --- SLIDER DATA ---
        const roastData = [
            { title: "RONI SETIAWAN", text: "Selamat Tahun Baru 2026! Semoga tahun ini rezekinya 'gacor' dan dijauhkan dari teman yang suka 'pinjam dulu seratus'." },
            { title: "GEN 98+", text: "Udah 2026 woy! Jangan cuma kondangan mulu, kapan ngundangnya? 🤣" },
            { title: "RESOLUSI 2026", text: "Jadi kaya raya tanpa harus ikut pesugihan. Rebahan, tapi saldo nambah terus." },
            { title: "PANTUN", text: "Makan ketan di pinggir jalan, mantan lewat tolong abaikan. Tahun depan ayo nikahan! Wkwk." },
            { title: "REALITA KERJA", text: "Semoga tahun ini kerjanya remote, gajinya dollar, tapi pengeluaran tetap rupiah warteg." },
            { title: "TIM JOMBLO", text: "Resolusi 2026, Berhenti jadi 'penjaga jodoh orang'. Saatnya jadi pemeran utama!" },
            { title: "KEUANGAN", text: "Ya Allah, semoga tahun ini dompet hamba setebal harapan orang tua hamba kepada hamba." },
            { title: "HOPE", text: "Diet wacana sudah berlalu, tahun ini body goals harus jadi nomor satu." },
            { title: "GEN Z", text: "Mental aman? Semoga tahun ini ga dikit-dikit 'Burnout' padahal baru kerja 5 menit." },
            { title: "AAMIIN", text: "Semoga semua yang baca ini sehat selalu, sukses karirnya, dan bahagia terus. Gas 2026!" }
        ];

        let sliderIndex = 0;
        const sliderContainer = document.getElementById('slider-container');
        function showNextCard() {
            const item = roastData[sliderIndex];
            sliderContainer.innerHTML = '';
            const card = document.createElement('div');
            card.className = 'roast-card';
            card.innerHTML = `<div class="roast-title">✨ ${item.title} ✨</div><div class="roast-content">"${item.text}"</div>`;
            sliderContainer.appendChild(card);
            sliderIndex = (sliderIndex + 1) % roastData.length;
        }
        showNextCard(); setInterval(showNextCard, 5000);

        // --- VISUAL (PARTICLES) ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const header = document.getElementById('main-header');
        let audioCtx;
        let mouse = { x: undefined, y: undefined };

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });

        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            if(type === 'boom') {
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            } else { 
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const a = Math.random() * 6.28; const s = Math.random() * 5 + 2;
                this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
                this.life = 1; this.decay = Math.random() * 0.015 + 0.01;
                this.gravity = 0.05;
            }
            update() {
                this.x += this.vx; this.y += this.vy; this.vy += this.gravity; this.life -= this.decay;
                if(mouse.x) {
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx*dx + dy*dy);
                    if(distance < 80) {
                        const force = (80 - distance) / 80;
                        this.x -= (dx/distance) * force * 5;
                        this.y -= (dy/distance) * force * 5;
                    }
                }
            }
            draw() { 
                ctx.globalAlpha = this.life; ctx.fillStyle = this.color; 
                ctx.beginPath(); ctx.arc(this.x, this.y, 2.5, 0, 6.28); ctx.fill(); 
            }
        }
        let particles = [];
        let stars = [];
        for(let i=0; i<100; i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2});
        
        function createExplosion(x, y, color) {
            playSound('boom');
            const colors = ['#ffd700', '#ffffff', '#ff4444', '#00f3ff'];
            const c = color || colors[Math.floor(Math.random() * colors.length)];
            for(let i=0; i<45; i++) particles.push(new Particle(x, y, c));
        }

        function animate() {
            ctx.fillStyle = 'rgba(15, 12, 41, 0.25)'; ctx.fillRect(0,0,canvas.width, canvas.height);
            stars.forEach(s => { 
                ctx.fillStyle = `rgba(255,255,255,${Math.random()})`; 
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.28); ctx.fill(); 
            });
            particles.forEach((p,i) => { p.update(); p.draw(); if(p.life<=0) particles.splice(i,1); });
            if(Math.random() < 0.015) createExplosion(Math.random()*canvas.width, Math.random()*canvas.height*0.6);
            requestAnimationFrame(animate);
        }

        overlay.addEventListener('click', () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            overlay.style.opacity = 0; setTimeout(()=>overlay.remove(), 800); animate();
        });

        // --- FIRESTORE LOGIC ---
        window.addEventListener('firebase-ready', () => {
            const feedDiv = document.getElementById('feed');
            const nameIn = document.getElementById('name-input');
            const msgIn = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            
            const colRef = window.collection(window.db, 'gala_party_2026');
            const q = window.query(colRef, window.orderBy('timestamp', 'asc'));

            if(localStorage.getItem('chatName')) nameIn.value = localStorage.getItem('chatName');

            window.onSnapshot(q, (snapshot) => {
                if(feedDiv.innerText.includes("Belum ada")) feedDiv.innerHTML = "";

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        const key = change.doc.id;

                        // AVATAR GENERATOR
                        const initial = data.name.charAt(0).toUpperCase();
                        const colors = ['#FF512F', '#DD2476', '#4CA1AF', '#1FA2FF', '#FFD200', '#F7971E'];
                        const bgAvatar = colors[initial.charCodeAt(0) % colors.length];

                        // SPECIAL ADMIN EFFECT
                        let nameDisplay = escapeHtml(data.name);
                        let specialClass = '';
                        if(nameDisplay === "RONI SETIAWAN") {
                            nameDisplay += ' <span class="verified">✓</span>';
                            specialClass = 'admin-card';
                        }

                        const div = document.createElement('div');
                        div.className = `wish-card ${specialClass}`;
                        div.id = `card-${key}`;
                        div.innerHTML = `
                            <div class="avatar" style="background:${bgAvatar}">${initial}</div>
                            <div class="card-content">
                                <div class="card-header">
                                    <span class="sender-name">${nameDisplay}</span>
                                    <span class="timestamp">${new Date(data.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                                </div>
                                <div class="card-body">${escapeHtml(data.message)}</div>
                                <div class="reply-container" id="reply-list-${key}"></div>
                                <div class="card-actions">
                                    <div class="action-btn" onclick="likePost('${key}')">
                                        <span id="heart-${key}" style="font-size:1.2rem">♡</span> <span id="likes-${key}">${data.likes||0}</span>
                                    </div>
                                    <div class="action-btn" onclick="toggleReply('${key}')" style="color:var(--gold)">↩ Balas</div>
                                </div>
                                <div class="reply-input-box" id="reply-box-${key}">
                                    <input type="text" class="reply-in" id="reply-input-${key}" placeholder="Tulis balasan...">
                                    <button class="reply-btn" onclick="sendReply('${key}')">></button>
                                </div>
                            </div>
                        `;
                        feedDiv.appendChild(div);
                        feedDiv.scrollTop = feedDiv.scrollHeight;

                        if(data.replies) data.replies.forEach(r => renderReply(key, r));
                        createExplosion(Math.random()*canvas.width, Math.random()*canvas.height/2);
                        playSound('pop');
                    }
                    if (change.type === "modified") {
                        const data = change.doc.data();
                        const key = change.doc.id;
                        document.getElementById(`likes-${key}`).innerText = data.likes || 0;
                        const cont = document.getElementById(`reply-list-${key}`);
                        cont.innerHTML = "";
                        if(data.replies) {
                            data.replies.forEach(r => renderReply(key, r));
                            cont.style.display = "block";
                        }
                    }
                });
            });

            // SEND MESSAGE
            sendBtn.onclick = async () => {
                const name = nameIn.value.trim().toUpperCase() || "ANONIM";
                const msg = msgIn.value.trim();
                if(!msg) return;
                localStorage.setItem('chatName', name);

                try {
                    await window.addDoc(colRef, {
                        name: name, message: msg, likes: 0, replies: [], timestamp: Date.now()
                    });
                    msgIn.value = "";
                    header.classList.add('shake'); setTimeout(()=>header.classList.remove('shake'), 400);
                    createExplosion(window.innerWidth/2, window.innerHeight - 100, '#ffd700');
                } catch (e) { alert("Gagal kirim: " + e.message); }
            };

            // QUICK REACT FUNCTION
            window.quickReact = async (emoji, text) => {
                const name = nameIn.value.trim().toUpperCase() || "ANONIM";
                const msg = `${emoji} ${text}`;
                localStorage.setItem('chatName', name);
                createExplosion(window.innerWidth/2, window.innerHeight/2, '#00f3ff');
                try {
                    await window.addDoc(colRef, { name: name, message: msg, likes: 0, replies: [], timestamp: Date.now() });
                } catch (e) { console.log(e); }
            };
        });

        // HELPERS
        window.likePost = (key) => {
            const heart = document.getElementById(`heart-${key}`);
            if(heart.innerText === '♡') {
                heart.innerText = '♥'; heart.classList.add('liked');
                const docRef = window.doc(window.db, 'gala_party_2026', key);
                window.updateDoc(docRef, { likes: window.increment(1) });
                createExplosion(window.innerWidth/2, window.innerHeight/2, '#ff4444');
            }
        };

        window.toggleReply = (key) => {
            document.getElementById(`reply-box-${key}`).classList.toggle('show');
        };

        window.sendReply = (key) => {
            const input = document.getElementById(`reply-input-${key}`);
            const text = input.value.trim();
            const name = document.getElementById('name-input').value.trim().toUpperCase() || "ANONIM";
            if(!text) return;

            const docRef = window.doc(window.db, 'gala_party_2026', key);
            window.updateDoc(docRef, { replies: window.arrayUnion({ name, text }) });
            input.value = "";
            document.getElementById(`reply-box-${key}`).classList.remove('show');
        };

        function renderReply(key, data) {
            const cont = document.getElementById(`reply-list-${key}`);
            cont.style.display = 'block';
            const div = document.createElement('div');
            div.className = 'reply-item';
            div.innerHTML = `<b style="color:var(--gold)">${escapeHtml(data.name)}:</b> ${escapeHtml(data.text)}`;
            cont.appendChild(div);
        }
        function escapeHtml(text) { return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
    </script>
</body>
</html>
